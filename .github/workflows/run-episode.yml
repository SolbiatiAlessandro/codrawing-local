name: list-hosted-replays

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Write existing Softmax credentials
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          test -n "$SOFTMAX_CREDENTIALS"
          umask 077
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
      - name: List existing hosted BOTPAINT replays
        run: uv run --python 3.12 --with "git+https://github.com/Metta-AI/coworld.git@4c26e519040ffe7182104f3417035020acea607b" python scripts/list_hosted_replays.py
      - name: Save replay inventory
        uses: actions/upload-artifact@v4
        with:
          name: hosted-replay-inventory
          path: hosted-replay-inventory.json
          retention-days: 30
      - name: Remove runner credential file
        if: always()
        run: rm -f ~/.softmax/credentials.yaml
