name: softmax-credit-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Write existing Softmax credentials
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          test -n "$SOFTMAX_CREDENTIALS"
          umask 077
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
      - name: Read current credit API and account allowance
        run: uv run --python 3.12 --with "git+https://github.com/Metta-AI/coworld.git@4c26e519040ffe7182104f3417035020acea607b" python scripts/softmax_credit_check.py
      - name: Save public API specification
        uses: actions/upload-artifact@v4
        with:
          name: public-openapi
          path: public-openapi.json
          retention-days: 1
      - name: Remove runner credential file
        if: always()
        run: rm -f ~/.softmax/credentials.yaml
