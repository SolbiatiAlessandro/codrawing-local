name: botpaint-league-setup
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect/create/configure the BOTPAINT league, or list/submit its policies
        type: choice
        options: [inspect, create, configure, submissions-status, submit, rounds, diagnose]
        default: inspect
      round_id:
        description: Round id for diagnose
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: botpaint-league-setup
  cancel-in-progress: false
jobs:
  league:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Load existing Softmax login
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          test -n "$SOFTMAX_CREDENTIALS"
          umask 077
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
      - name: Manage BOTPAINT league
        env:
          LEAGUE_ACTION: ${{ inputs.action }}
          ROUND_ID: ${{ inputs.round_id }}
        run: |
          case "$LEAGUE_ACTION" in
            submissions-status) script=scripts/submit_botpaint_policies.py; arg=status ;;
            submit) script=scripts/submit_botpaint_policies.py; arg=submit ;;
            rounds) script=scripts/submit_botpaint_policies.py; arg=rounds ;;
            diagnose) script=scripts/submit_botpaint_policies.py; arg=diagnose ;;
            *) script=scripts/manage_botpaint_league.py; arg="$LEAGUE_ACTION" ;;
          esac
          uv run --no-project --python 3.12 --with "git+https://github.com/Metta-AI/coworld.git@4c26e519040ffe7182104f3417035020acea607b" python "$script" "$arg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botpaint-league-status
          path: |
            botpaint-league-status.json
            botpaint-submissions-status.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove runner login
        if: always()
        run: rm -f ~/.softmax/credentials.yaml
