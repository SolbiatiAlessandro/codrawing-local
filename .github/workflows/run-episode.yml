name: botpaint-publication-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Read publication state with existing credential
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          umask 077
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
          uv run --python 3.12 --with 'git+https://github.com/Metta-AI/coworld.git@4c26e519040ffe7182104f3417035020acea607b' python - <<'PY'
          import json
          from coworld.upload import CoworldUploadClient, DEFAULT_SUBMIT_SERVER
          out=[]
          with CoworldUploadClient.from_login(server_url=DEFAULT_SUBMIT_SERVER) as client:
              for row in client.iter_coworlds_by_name('botpaint'):
                  cow=client.get_coworld(row.id)
                  cert=client.get_coworld_certification(row.id)
                  out.append({'id':cow.id,'name':cow.name,'version':cow.version,'canonical':cow.canonical,'viewer':cow.manifest.get('game',{}).get('replay_viewer'),'certification':{'state':cert.state,'failed_step':cert.failed_step}})
          with open('botpaint-publication-status.json','w') as f:json.dump(out,f,indent=2)
          for row in out:
              print(json.dumps({k:row[k] for k in ('id','name','version','canonical','viewer')}))
              print('Certification:',row['certification'].get('state'))
          if not out:print('No botpaint version registered yet')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: botpaint-publication-status
          path: botpaint-publication-status.json
      - name: Remove temporary credentials
        if: always()
        run: rm -f ~/.softmax/credentials.yaml
