name: three-small-matches

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botpaint-three-small-matches-20260910
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Write existing Softmax credentials
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          test -n "$SOFTMAX_CREDENTIALS"
          umask 077
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
      - name: Submit three two-round matches and track replays
        run: uv run --python 3.12 --with "git+https://github.com/Metta-AI/coworld.git@4c26e519040ffe7182104f3417035020acea607b" python scripts/run_small_matches.py
      - name: Save sanitized episode status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-matches-status
          path: small-matches-status.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove runner credential file
        if: always()
        run: rm -f ~/.softmax/credentials.yaml
