# Builds the slim player image on a native amd64 runner and uploads it as a
# Coworld policy. Runs remotely so no container image is ever built on the
# laptop: local builds fill the boot disk, and a full boot disk stops macOS
# from growing its swap file.
#
# The image carries every player module, so `module` picks which one this
# policy runs. LLM seats need `use_bedrock: true`; the platform then injects
# AWS_ENDPOINT_URL_BEDROCK_RUNTIME and BEDROCK_MODEL into the pod and signs the
# calls, so no model credentials ship in the image.
#
# Needs the SOFTMAX_CREDENTIALS repo secret: the exact content of
# ~/.softmax/credentials.yaml for an account allowed to upload policies.

name: upload-player-policy

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Policy name to upload under"
        required: true
        default: "coplace-versus-llm"
      module:
        description: "Player module to run"
        required: true
        default: "codrawing.player.versus_llm_player"
      routing:
        description: "Where the seat's model calls go"
        type: choice
        required: true
        default: openrouter
        options: [openrouter, bedrock, none]
      model:
        description: "Model id: an OpenRouter slug, or a Bedrock model id"
        required: true
        default: "google/gemini-2.5-flash-lite"
      canvas_image:
        description: "Also send the canvas as a PNG (needs a vision model)"
        type: boolean
        required: true
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install coworld CLI
        run: uv tool install git+https://github.com/Metta-AI/coworld.git

      - name: Write Softmax credentials
        env:
          SOFTMAX_CREDENTIALS: ${{ secrets.SOFTMAX_CREDENTIALS }}
        run: |
          test -n "$SOFTMAX_CREDENTIALS" || { echo "SOFTMAX_CREDENTIALS secret is empty" >&2; exit 1; }
          mkdir -p ~/.softmax
          printf '%s' "$SOFTMAX_CREDENTIALS" > ~/.softmax/credentials.yaml
          chmod 600 ~/.softmax/credentials.yaml

      - name: Build the player image
        run: docker build --target player -t coplace-versus-player:ci .

      - name: Upload the policy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          args=(coplace-versus-player:ci
                --name "${{ inputs.name }}"
                --run python --run -m --run "${{ inputs.module }}")
          case "${{ inputs.routing }}" in
            openrouter)
              test -n "$OPENROUTER_API_KEY" || {
                echo "routing=openrouter needs the OPENROUTER_API_KEY repo secret" >&2; exit 1; }
              # --secret-env is the only env injection upload-policy offers,
              # so the model slug rides along with the key. The platform keeps
              # both in AWS Secrets Manager and injects them into the pod.
              args+=(--secret-env "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
                     --secret-env "OPENROUTER_MODEL=${{ inputs.model }}")
              if [ "${{ inputs.canvas_image }}" = "true" ]; then
                args+=(--secret-env "CANVAS_IMAGE=1")
              fi
              ;;
            bedrock)
              args+=(--use-bedrock --bedrock-model "${{ inputs.model }}")
              ;;
          esac
          coworld upload-policy "${args[@]}"
