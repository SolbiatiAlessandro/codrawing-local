<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>codrawing · the robot atelier</title>
  <style>
    /* The atelier faces. Loaded from inside the stylesheet, not a <link>,
       because the standalone match page keeps only this <style> block. */
    @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap');
    /* The "Atelier — Day Match" view (design mock: robot-atelier/Main.dc.html).
       A warm painter's studio: cream plaster wall, wooden plank floor, a dark
       gallery header, and two big canvases on wooden easels — one per team —
       each showing that team's scored region of the shared board, scaled up
       with crisp pixels. Team robots stand at the foot of their painting and
       their chat shows as small pixel-font speech bubbles. Every colour is
       painted explicitly so the page holds on any host. */
    :root {
      --ink: #3a2c20; --canvas-paper: #FBF6EA; --wall-hi: #EFE4CE; --wall-lo: #D9C6A6;
      --wood: #8B5E34; --wood-dark: #6B4423; --brass: #C9A227;
      --header: #2B2119; --cream: #F2E9D8; --warm: #F5A524; --cool: #38BDF8;
      --muted: #8a7a6a; --red: #E11D48; --green: #2C9A55;
      --px: 'Silkscreen', ui-monospace, Menlo, monospace;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sf: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #1c150f; color: var(--ink); font-family: var(--sf); overflow: hidden; -webkit-font-smoothing: antialiased; display: flex; justify-content: center; align-items: flex-start; }
    a { color: var(--wood); }
    /* The design is a 1440x900 stage; the page IS that stage, zoomed to fit
       the window, so every size inside matches the artboard on any screen. */
    main { position: relative; width: 1440px; height: 900px; flex: none; overflow: hidden; background: #F2E9D8; }

    /* ---------- header ---------- */
    .hdr { position: absolute; left: 0; top: 0; width: 1440px; height: 92px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; background: linear-gradient(180deg, #2B2119, #38291d); border-bottom: 4px solid var(--wood); z-index: 6; }
    .wordmark { display: flex; align-items: baseline; gap: 14px; }
    .wordmark .wm1 { font-family: var(--px); font-size: 21px; color: var(--cream); letter-spacing: 1px; }
    .wordmark .wm2 { font-family: var(--serif); font-size: 19px; font-style: italic; color: var(--brass); }
    .clock { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .clock .t { font-family: var(--px); font-size: 20px; color: var(--cream); white-space: nowrap; }
    .clock .bar { width: 220px; height: 8px; background: #514036; border-radius: 4px; overflow: hidden; }
    .clock .bar i { display: block; width: 0; height: 8px; background: linear-gradient(90deg, #C9A227, #F5A524); transition: width .35s ease; }
    .matchup { display: flex; align-items: center; gap: 10px; font-family: var(--px); font-size: 12px; }
    .matchup .a { color: var(--warm); } .matchup .vs { color: var(--muted); } .matchup .b { color: var(--cool); }
    .matchup .n { font-size: 11px; color: var(--muted); margin-left: 8px; }

    /* ---------- the room ---------- */

    /* A gentle scrim — a touch of warm light behind the easel, a soft
       vignette at the edges — so plaques, bubbles and robots stay legible
       over the busy pixel art. */
    .wall::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,246,220,0.18), rgba(255,246,220,0) 55%, rgba(28,21,15,0.30) 100%), linear-gradient(180deg, rgba(28,21,15,0.10), rgba(28,21,15,0) 22%, rgba(28,21,15,0) 72%, rgba(28,21,15,0.22) 100%); }
    .splat { position: absolute; border-radius: 50%; }
    .splat.a { left: 250px; top: 856px; width: 64px; height: 18px; background: var(--warm); opacity: .35; }
    .splat.b { left: 1120px; top: 858px; width: 58px; height: 16px; background: var(--cool); opacity: .32; }

    /* ---------- easel sides ---------- */
    .side { position: absolute; top: 0; width: 720px; height: 900px; transition: transform .3s ease; }
    #side-a { left: 0; } #side-b { left: 720px; }
    main.solo #side-b, main.solo #vs, main.solo .splat.b { display: none; }
    main.solo #side-a { transform: translateX(360px); }
    /* Shared-canvas mode: the two teams are scored on the IDENTICAL region,
       so there is only one painting — one centered easel showing it, Team A's
       robots and plaque flanking the left, Team B's the right. Ownership
       marks are suppressed (ownership is meaningless on a shared canvas). */
    main.shared #side-a .easel, main.shared #side-a .board, main.shared #side-a .tray { transform: translateX(360px); }
    main.shared #side-b .easel, main.shared #side-b .board, main.shared #side-b .tray { display: none; }
    main.shared #vs { display: none; }
    main.shared #side-a .plaque { left: 570px; }
    main.shared #side-b .plaque { left: 150px; }
    /* the two lead-painter brushes are anchored for the two-easel layout and
       would land on the central canvas — hidden on a shared canvas */
    main.shared .brush { display: none; }
    /* BUBBLES toggle: watch a completely clean canvas */
    main.nobubbles .bub { display: none !important; }
    .easel { position: absolute; left: 10px; top: 60px; }
    /* The frame hugs the painting: no fixed size — drawRegion sizes the
       canvas to the biggest crisp integer cell that fits the stage, then
       centers this frame on the easel, so the pixels dominate the view even
       for small arenas instead of floating in cream. */
    .board { position: absolute; left: 52px; top: 136px; border: 6px solid var(--wood); background: var(--canvas-paper); box-shadow: 0 10px 26px rgba(59,42,26,.4), inset 0 0 20px rgba(59,42,26,.1); padding: 8px; z-index: 2; }
    .board canvas { display: block; image-rendering: pixelated; }
    .tray { position: absolute; left: 30px; top: 832px; width: 660px; height: 16px; background: var(--wood); border-top: 3px solid var(--wood-dark); border-radius: 3px; box-shadow: 0 4px 8px rgba(59,42,26,.35); z-index: 3; }
    .plaque { position: absolute; left: 50%; transform: translateX(-50%); top: 762px; width: 250px; background: var(--canvas-paper); border: 2px solid var(--wood); border-radius: 4px; box-shadow: 0 4px 10px rgba(59,42,26,.35); padding: 8px 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; z-index: 4; }
    .plaque .team { font-family: var(--px); font-size: 10px; letter-spacing: 2px; }
    #side-a .plaque .team { color: var(--warm); } #side-b .plaque .team { color: var(--cool); }
    .plaque .line { font-family: var(--serif); font-variant: small-caps; font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1; white-space: nowrap; }
    .plaque .line .score { font-family: var(--px); font-size: 18px; }
    /* Painter robots: one sprite, seat variants cut by CSS filters — warm
       hues for Team A, cool (≈195° rotated) hues for Team B. Each seat is a
       full-height column holding the robot AND its speech bubble, so one
       translateX moves them together when the robot wanders the floor.
       Wandering is grounded: horizontal glides only (JS picks a new spot in
       the seat's zone every few seconds), feet on the floor line, with a
       tiny rock while rolling. No vertical motion. */
    .bots .seat { position: absolute; top: 0; height: 900px; z-index: 4; pointer-events: none; }
    .bots .rock { position: absolute; left: 0; width: 100%; transform-origin: 50% 100%; }
    .bots .seat.gliding .rock { animation: rock .9s ease-in-out infinite alternate; }
    @keyframes rock { from { rotate: -1.2deg; } to { rotate: 1.2deg; } }
    .bots img { display: block; width: 100%; image-rendering: pixelated; filter: drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    #side-b .bots img { transform: scaleX(-1); }
    .bots img.v0 { }
    .bots img.v1 { filter: hue-rotate(-25deg) saturate(1.1) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.v2 { filter: hue-rotate(25deg) brightness(1.05) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.v3 { filter: hue-rotate(-50deg) brightness(.95) saturate(1.15) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.c0 { filter: hue-rotate(195deg) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.c1 { filter: hue-rotate(170deg) saturate(1.1) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.c2 { filter: hue-rotate(220deg) brightness(1.05) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    .bots img.c3 { filter: hue-rotate(145deg) brightness(.95) saturate(1.15) drop-shadow(0 6px 4px rgba(59,42,26,.25)); }
    @media (prefers-reduced-motion: reduce) { .bots .seat { transition: none !important; transform: none !important; } .bots .seat.gliding .rock { animation: none; } }
    .brush { position: absolute; z-index: 4; }
    #side-a .brush { left: 606px; top: 690px; } #side-b .brush { left: 62px; top: 690px; }

    /* speech bubbles: one per robot, never truncated. Each rides inside its
       robot's seat column (so it follows the robot as it wanders), anchored
       by its bottom edge and stacked upward over the canvas foot so the four
       bubbles on a side never collide with each other or the plaque. The
       body is a small readable face; Silkscreen is kept for the label. */
    .bub { position: absolute; width: 254px; background: #FFFDF6; border: 2px solid var(--ink); border-radius: 8px; padding: 7px 10px 8px; box-shadow: 3px 3px 0 rgba(58,44,32,.25); z-index: 5; pointer-events: auto; }
    .bub .who { font-family: var(--px); font-size: 8px; letter-spacing: 1px; display: block; padding-bottom: 2px; }
    .bub .hl { font-family: var(--px); font-size: 11px; line-height: 1.5; display: block; overflow-wrap: anywhere; }
    .bub .txt { font-family: var(--sf); font-size: 11px; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: 3px; }
    .bub.open .txt { display: block; -webkit-line-clamp: unset; }
    .bub .more { font-family: var(--px); font-size: 8px; color: var(--wood); cursor: pointer; display: inline-block; padding-top: 4px; letter-spacing: 1px; }
    .bub .more:hover { color: var(--wood-dark); }
    .bub .tail { position: absolute; bottom: -10px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid var(--ink); }
    .bub.all { border-color: var(--brass); }
    .bub.all .tail { border-top-color: var(--brass); }
    .bub.dim { opacity: .68; }

    /* chat transcript drawer: every message of the episode so far, full text,
       on a parchment panel that slides in from the right */
    .transcript { position: absolute; right: -404px; top: 92px; bottom: 40px; width: 392px; background: linear-gradient(180deg, #FBF6EA, #F4EAD4); border-left: 4px solid var(--wood); box-shadow: -12px 0 30px rgba(30,20,10,.25); z-index: 7; display: flex; flex-direction: column; transition: right .25s ease; }
    main.chat-open .transcript { right: 0; }
    .transcript .thead { flex: none; padding: 12px 16px 10px; border-bottom: 2px solid var(--wood); font-family: var(--px); font-size: 12px; color: var(--ink); letter-spacing: 1px; display: flex; justify-content: space-between; align-items: baseline; }
    .transcript .thead .n { font-size: 9px; color: var(--muted); }
    .tlines { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 14px; scrollbar-width: thin; }
    .tdiv { display: flex; align-items: center; gap: 10px; padding: 10px 0 4px; font-family: var(--px); font-size: 9px; color: var(--muted); letter-spacing: 1px; }
    .tdiv i { flex: 1; height: 1px; background: rgba(107,68,35,.25); display: block; }
    .tmsg { padding: 5px 0; }
    .tmsg .who { font-family: var(--px); font-size: 9px; letter-spacing: 1px; }
    .tmsg .chip { font-family: var(--px); font-size: 8px; color: #2B2119; background: var(--brass); border-radius: 3px; padding: 1px 4px; margin-left: 6px; }
    .tmsg .body { font-family: var(--serif); font-size: 16px; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
    @media (prefers-reduced-motion: reduce) { .transcript { transition: none; } }

    /* VS medallion */
    #vs { position: absolute; left: 678px; top: 420px; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; z-index: 3; }
    #vs span { position: relative; font-family: var(--px); font-size: 24px; color: var(--cream); }

    /* winner ribbon */
    #winner { position: absolute; left: 50%; top: 300px; transform: translate(-50%, 0); background: var(--header); color: var(--cream); border: 3px solid var(--brass); border-radius: 6px; padding: 16px 26px; font-family: var(--px); font-size: 18px; white-space: nowrap; box-shadow: 0 12px 30px rgba(30,20,10,.5); z-index: 7; }
    @keyframes hang { 0% { transform: translate(-50%, -30px); opacity: 0; } 100% { transform: translate(-50%, 0); opacity: 1; } }
    #winner.hang { animation: hang .5s cubic-bezier(.2,.9,.3,1.2) both; }
    @media (prefers-reduced-motion: reduce) { #winner.hang { animation: none; } }

    /* ---------- chrome (replay / live controls) ---------- */
    .chrome { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(43,33,25,.92); border-top: 2px solid var(--wood-dark); display: flex; align-items: center; gap: 14px; padding: 0 14px; z-index: 8; }
    .chrome button { background: transparent; border: 0; padding: 0; cursor: pointer; color: var(--cream); display: flex; align-items: center; }
    .chrome button svg { display: block; }
    .chrome .tlabel { font-family: var(--px); font-size: 11px; color: var(--cream); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chrome .badge { font-family: var(--px); font-size: 10px; color: #c9bda9; letter-spacing: .04em; border: 1px solid #514036; border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
    .chrome .badge.live { color: #FFFFFF; border-color: var(--red); background: var(--red); }
    .chrome #speed, .chrome #bubbles, .chrome #chatlog, .chrome #download { font-family: var(--px); font-size: 10px; color: #c9bda9; border: 1px solid #514036; border-radius: 3px; padding: 2px 6px; }
    main.chat-open .chrome #chatlog { color: #2B2119; background: var(--brass); border-color: var(--brass); }
    main.nobubbles .chrome #bubbles { color: #6b5d4d; border-style: dashed; }
    .chrome input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: #514036; outline: none; margin: 0; cursor: pointer; }
    .chrome input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 2px var(--brass); }
    .chrome input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--cream); border: 0; box-shadow: 0 0 0 2px var(--brass); }
  </style>
</head>

  <div id="vs">

      <line x1="350" y1="46" x2="630" y2="820" stroke="#8B5E34" stroke-width="14" stroke-linecap="round"></line>
      <line x1="350" y1="700" x2="350" y2="828" stroke="#6B4423" stroke-width="11" stroke-linecap="round"></line>

      <circle cx="350" cy="44" r="5" fill="#C9A227"></circle>
    </svg>

    <svg class="brush" width="52" height="64" viewBox="0 0 52 64">

  // Grounded wandering: every few seconds a seat glides to a new spot on
  // the floor inside its own zone (never past the side edges), rocking a
  // degree or two while it rolls. No vertical motion — wheels stay planted.
  function startWander(seat) {
    if (!MOTION) return;
    const home = Number(seat.dataset.x), width = Number(seat.dataset.w);
    const lo = Number(seat.dataset.min || 6), hi = Number(seat.dataset.max || 714);
    const minDx = -Math.min(38, Math.max(0, home - lo));
    const maxDx = Math.min(38, Math.max(0, hi - home - width));
    const step = () => {
      const pause = 900 + Math.random() * 3600;
      setTimeout(() => {
        if (!seat.isConnected) return;
        const dx = minDx + Math.random() * (maxDx - minDx);
        const dur = 1800 + Math.random() * 2600;
        seat.style.transition = 'transform ' + Math.round(dur) + 'ms ease-in-out';
        seat.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
        seat.classList.add('gliding');
        setTimeout(() => { seat.classList.remove('gliding'); step(); }, dur);
      }, pause);
    };
    step();
  }

  const WHITE = '#FFFFFF';

  const MOTION = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const STAGE = { w: 1440, h: 900 };
  let ZOOM = 1;
  function fitStage() {
    ZOOM = Math.max(0.2, Math.min(window.innerWidth / STAGE.w, window.innerHeight / STAGE.h));
    document.querySelector('#main').style.zoom = ZOOM;
  }
  // Canvas backing stores account for the zoom so pixels stay crisp.
  function dpr() { return (window.devicePixelRatio || 1) * ZOOM; }
  fitStage();

  const status = document.querySelector('#status');
  const timeline = document.querySelector('#timeline');
  const playButton = document.querySelector('#play');
  let frames = [], frameIndex = 0, playing = true, timer = null;
  let liveFrames = [];
  let liveLatest = {};       // live mode: each seat's latest message, for the bubbles
  let liveTranscript = [];   // live mode: every [frame, messages] pair, for the drawer
  let seatLayout = null;
  let teamModels = null;     // from the replay config or the live snapshot, when known

  function esc(value) {
    const node = document.createElement('div'); node.textContent = value; return node.innerHTML;
  }
  function fmtScore(value) { return (value || 0).toFixed(2); }
  function pct(value, digits) { return (100 * (value || 0)).toFixed(digits === undefined ? 1 : digits); }
  function titleCase(s) { return String(s || '').replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1)); }

  /* ---------- geometry helpers ---------- */
  function regionAt(frame, x) {
    return (frame.teams || []).findIndex(t => x >= t.region.x && x < t.region.x + t.region.width);
  }
  function teamOfSlot(frame, slot) {
    return (frame.teams || []).findIndex(t => t.slots.includes(slot));
  }
  // Shared-canvas episodes: both teams are scored on the IDENTICAL region,
  // so there is only one painting and ownership marks mean nothing.
  function isShared(frame) {
    const teams = frame.teams || [];
    if (teams.length !== 2) return false;
    const [r, s] = [teams[0].region, teams[1].region];
    return r.x === s.x && r.y === s.y && r.width === s.width && r.height === s.height;
  }
  function isAttack(frame, owner, index) {
    if (!(frame.teams || []).length || owner === undefined || owner < 0) return false;
    const region = regionAt(frame, index % frame.width);
    return region >= 0 && teamOfSlot(frame, owner) !== region;
  }

  /* ---------- robots ---------- */
  function layoutSides(frame) {
    const teams = frame.teams || [];
    const count = (frame.player_names || []).length || 5;
    const next = teams.length === 2
      ? { versus: true, shared: isShared(frame), left: teams[0].slots.slice(), right: teams[1].slots.slice() }
      : { versus: false, shared: false, left: Array.from({ length: count }, (_, i) => i), right: [] };
    const same = seatLayout && seatLayout.versus === next.versus && seatLayout.shared === next.shared &&
      String(seatLayout.left) === String(next.left) && String(seatLayout.right) === String(next.right);
    if (same) return;
    seatLayout = next;
    document.querySelector('#main').classList.toggle('solo', !next.versus);
    document.querySelector('#main').classList.toggle('shared', next.shared);
    next.anchorsA = next.shared ? BOT_ANCHORS_A_SHARED : BOT_ANCHORS_A;
    next.anchorsB = next.shared ? BOT_ANCHORS_B_SHARED : BOT_ANCHORS_B;
    [['a', next.left, next.anchorsA, 'v', GUTTER_A], ['b', next.right, next.anchorsB, 'c', GUTTER_B]].forEach(([side, slots, anchors, tone, gutter]) => {
      const el = document.querySelector('#bots-' + side);
      const bounds = next.shared ? gutter : { min: 6, max: 714 };
      el.innerHTML = slots.slice(0, anchors.length).map((slot, i) => {
        const a = anchors[i];
        return '<div class="seat" id="seat-' + side + '-' + slot + '" data-x="' + a.x + '" data-w="' + a.w + '"' +
          ' data-min="' + bounds.min + '" data-max="' + bounds.max + '"' +
          ' style="left:' + a.x + 'px;width:' + a.w + 'px;">' +
          '<div class="rock" style="top:' + a.y + 'px;">' +
          '<img class="' + tone + (i % 4) + '" src="' + PAINTER + '" alt="agent' + slot + '" title="agent' + slot + '"></div>' +
          '<div class="bub" id="bub-' + side + '-' + slot + '" hidden></div></div>';
      }).join('');
      el.querySelectorAll('.seat').forEach(startWander);
    });
    if (next.versus) {
      document.querySelector('#team-a').textContent = teams[0].name.toUpperCase();
      document.querySelector('#team-b').textContent = teams[1].name.toUpperCase();
    } else {
      document.querySelector('#team-a').textContent = 'THE ROBOTS';
    }
  }

  /* ---------- header ---------- */
  function renderHeader(frame) {
    const teams = frame.teams || [];
    document.querySelector('#clock').textContent = 'TURN ' + frame.turn + ' / ' + frame.max_turns;
    document.querySelector('#clockbar').style.width =
      Math.max(0, Math.min(100, 100 * frame.turn / Math.max(1, frame.max_turns))) + '%';
    const matchup = document.querySelector('#matchup');
    if (teams.length === 2) {
      matchup.innerHTML = '<span class="a">' + esc(teams[0].target.toUpperCase()) + '</span>' +
        '<span class="vs">VS</span><span class="b">' + esc(teams[1].target.toUpperCase()) + '</span>' +
        '<span class="n">' + teams[0].slots.length + 'v' + teams[1].slots.length +
        (isShared(frame) ? ' · SHARED CANVAS' : '') + '</span>';
    } else {
      const bots = (frame.player_names || []).length || 0;
      matchup.innerHTML = '<span class="a">' + esc(String(frame.target || '').toUpperCase()) + '</span>' +
        '<span class="n">' + bots + ' ROBOT' + (bots === 1 ? '' : 'S') + ' · 1 PIXEL EACH PER TURN</span>';
    }
  }

  /* ---------- the paintings ---------- */
  function drawRegion(side, frame, region) {
    const canvas = document.querySelector('#board-' + side);
    if (!canvas) return;
    // Give the painting as much of the stage as the layout allows: the
    // single shared-canvas easel has the whole centre of the room, the
    // two-easel layout a little less. The biggest crisp integer cell that
    // fits wins — small arenas like 24x16 get big chunky pixels.
    const shared = (frame.teams || []).length === 2 && isShared(frame);
    const inner = shared ? { w: 700, h: 700 } : { w: 656, h: 692 };
    const cell = Math.max(4, Math.floor(Math.min(inner.w / region.width, inner.h / region.height)));
    const size = { w: region.width * cell + 1, h: region.height * cell + 1 };
    const scale = dpr();
    canvas.width = size.w * scale; canvas.height = size.h * scale;
    canvas.style.width = size.w + 'px'; canvas.style.height = size.h + 'px';
    // The wooden frame hugs the painting, centered on the easel's cross bar.
    const board = canvas.parentElement;
    if (board && board.classList.contains('board')) {
      const chrome = 2 * (6 + 8);   // border + padding on each side
      board.style.left = Math.round(360 - (size.w + chrome) / 2) + 'px';
      board.style.top = Math.round(486 - (size.h + chrome) / 2) + 'px';
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#FBF6EA';
    ctx.fillRect(0, 0, size.w, size.h);
    // gesso grid: faint, warm
    ctx.strokeStyle = 'rgba(107,68,35,0.10)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= region.width; x++) {
      ctx.beginPath(); ctx.moveTo(x * cell + 0.5, 0); ctx.lineTo(x * cell + 0.5, size.h); ctx.stroke();
    }
    for (let y = 0; y <= region.height; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * cell + 0.5); ctx.lineTo(size.w, y * cell + 0.5); ctx.stroke();
    }
    const gap = Math.max(1, Math.round(cell * 0.08));
    for (let ry = 0; ry < region.height; ry++) {
      for (let rx = 0; rx < region.width; rx++) {
        const i = (region.y + ry) * frame.width + (region.x + rx);
        const color = frame.canvas[i];
        if (color === WHITE) continue;
        ctx.fillStyle = color;
        ctx.fillRect(rx * cell + gap, ry * cell + gap, cell - 2 * gap + 1, cell - 2 * gap + 1);
      }
    }
    // squares inside this painting held by the other side; an erased one shows
    // as a cross — suppressed on a shared canvas, where ownership means nothing
    if ((frame.teams || []).length === 2 && frame.owners && !isShared(frame)) {
      for (let ry = 0; ry < region.height; ry++) {
        for (let rx = 0; rx < region.width; rx++) {
          const i = (region.y + ry) * frame.width + (region.x + rx);
          if (!isAttack(frame, frame.owners[i], i)) continue;
          const x = rx * cell, y = ry * cell;
          ctx.strokeStyle = '#E11D48';
          ctx.lineWidth = Math.max(1, cell * 0.14);
          ctx.strokeRect(x + gap + 0.5, y + gap + 0.5, cell - 2 * gap, cell - 2 * gap);
          if (frame.canvas[i] === WHITE) {
            const p = Math.max(2, cell * 0.3);
            ctx.beginPath();
            ctx.moveTo(x + p, y + p); ctx.lineTo(x + cell - p, y + cell - p);
            ctx.moveTo(x + cell - p, y + p); ctx.lineTo(x + p, y + cell - p);
            ctx.stroke();
          }
        }
      }
    }
  }
  function drawBoards(frame) {
    const teams = frame.teams || [];
    if (teams.length === 2 && !isShared(frame)) {
      drawRegion('a', frame, teams[0].region);
      drawRegion('b', frame, teams[1].region);
    } else if (teams.length === 2) {
      // one shared painting: the single centered easel shows it once
      drawRegion('a', frame, teams[0].region);
    } else {
      drawRegion('a', frame, { x: 0, y: 0, width: frame.width, height: frame.height });
    }
  }

  /* ---------- plaques ---------- */
  function renderPlaques(frame) {
    const teams = frame.teams || [];
    if (teams.length === 2) {
      const feedback = frame.team_feedback || [];
      teams.forEach((team, k) => {
        const f = feedback[k] || {};
        document.querySelector('#plaque-' + (k ? 'b' : 'a')).innerHTML =
          esc(titleCase(team.target)) + ' &middot; <span class="score">' + fmtScore(f.target_score) + '</span>';
      });
    } else {
      const fb = frame.image_model_feedback || {};
      document.querySelector('#plaque-a').innerHTML =
        esc(titleCase(frame.target)) + ' &middot; <span class="score">' + fmtScore(fb.target_score) + '</span>';
    }
  }

  /* ---------- speech bubbles ---------- */
  function teamOfMessage(frame, m) {
    if (m.team !== undefined && m.team !== null) return m.team;
    const k = teamOfSlot(frame, m.slot);
    return k >= 0 ? k : 0;
  }
  // The latest message of every seat, up to the frame on screen. `fresh`
  // marks messages that arrived with the current frame; older ones dim.
  function latestPerSlot(index) {
    const map = {};
    if (frames.length) {
      const upto = index === undefined ? frames.length - 1 : index;
      for (let f = 0; f <= upto && f < frames.length; f++) {
        for (const m of frames[f].messages || []) map[m.slot] = { m, fresh: f === upto };
      }
      return map;
    }
    return liveLatest;
  }
  function renderBubbles(frame, index) {
    if (!seatLayout) return;
    const found = latestPerSlot(index);
    const shared = seatLayout.shared;
    [['a', seatLayout.left, seatLayout.anchorsA || BOT_ANCHORS_A], ['b', seatLayout.right, seatLayout.anchorsB || BOT_ANCHORS_B]].forEach(([side, slots, anchors], k) => {
      const placed = [];   // stacked so no two bubbles on a side ever collide
      // In shared mode bubbles stay inside the side gutter, off the painting —
      // padded by the wander range, since a bubble drifts with its robot.
      const PAD = 38;
      const clampLo = shared ? (side === 'b' ? GUTTER_B.min + PAD : 6 + PAD) : 6;
      const clampHi = shared
        ? (side === 'a' ? GUTTER_A.max - BUB_BOX - PAD : 714 - BUB_BOX - PAD)
        : 720 - BUB_BOX - 6;
      slots.slice(0, anchors.length).forEach((slot, i) => {
        const bub = document.querySelector('#bub-' + side + '-' + slot);
        if (!bub) return;
        const entry = found[slot];
        if (!entry) { bub.hidden = true; return; }
        const a = anchors[i];
        const center = a.x + a.w / 2;
        const left = Math.max(clampLo, Math.min(clampHi, center - BUB_BOX / 2));
        const turnTag = !entry.fresh && entry.m.turn !== undefined ? ' · T' + entry.m.turn : '';
        bub.hidden = false;
        bub.classList.toggle('dim', !entry.fresh);
        bub.classList.toggle('all', !!entry.m.public);
        bub.style.left = (left - a.x) + 'px';
        // Headline first: the message convention is "one headline line, then
        // the detail". Old replays without one fall back to the first
        // sentence. The 2-line preview expands to full text behind MORE; the
        // CHAT drawer always has everything.
        const raw = String(entry.m.text || '');
        const nl = raw.indexOf('\n');
        let headline, body;
        if (nl > 0) {
          headline = raw.slice(0, nl).trim();
          body = raw.slice(nl + 1).trim();
        } else {
          const sentence = raw.match(/^.{0,59}?[.!?](?=\s|$)/);
          headline = (sentence ? sentence[0] : raw.slice(0, 60)).trim();
          body = raw.slice(headline.length).trim();
        }
        const msgkey = slot + '|' + (entry.m.turn !== undefined ? entry.m.turn : '') + '|' + headline;
        if (bub.dataset.msgkey !== msgkey) { bub.classList.remove('open'); bub.dataset.msgkey = msgkey; }
        const open = bub.classList.contains('open');
        bub.innerHTML =
          '<span class="who" style="color:' + TEAM_ACCENTS[k] + ';">AGENT ' + slot +
          (entry.m.public ? ' · TO ALL' : '') + turnTag + '</span>' +
          '<span class="hl" style="color:' + TEAM_INKS[k] + ';">' + esc(headline) + '</span>' +
          (body
            ? '<span class="txt">' + esc(body) + '</span><span class="more">' + (open ? 'LESS' : 'MORE') + '</span>'
            : '') +
          '<i class="tail" style="left:' + Math.max(10, Math.min(BUB_BOX - 30, center - left - 8)) + 'px;"></i>';
        // greedy stacking: start at the base, rise above any placed bubble
        // this one would horizontally overlap (drift margin included)
        let bottom = BUB_BASE;
        for (const p of placed) {
          const apart = left + BUB_BOX + 44 <= p.left || left >= p.left + BUB_BOX + 44;
          if (!apart) bottom = Math.max(bottom, p.bottom + p.height + BUB_GAP);
        }
        bub.style.bottom = bottom + 'px';
        const height = bub.offsetHeight;
        // A narrow gutter can run out of room: prefer a clear canvas over
        // showing everything — the CHAT drawer always has the full log.
        if (shared && bottom + height > 760) { bub.hidden = true; return; }
        placed.push({ left, bottom, height });
      });
    });
  }

  /* ---------- chat transcript ---------- */
  function transcriptMsgHtml(m, frame) {
    const k = teamOfMessage(frame, m);
    const accent = TEAM_ACCENTS[(frame.teams || []).length === 2 ? k : 0];
    return '<div class="tmsg"><span class="who" style="color:' + accent + ';">AGENT ' + m.slot + '</span>' +
      (m.public ? '<span class="chip">TO ALL</span>' : '') +
      '<div class="body">' + esc(String(m.text || '')) + '</div></div>';
  }
  function renderTranscript(frame, index) {
    const el = document.querySelector('#tlines');
    if (!el) return;
    // In replay the transcript tracks the scrubbed turn: everything said up
    // to and including the frame on screen, nothing from the future.
    const groups = [];
    if (frames.length) {
      const upto = index === undefined ? frames.length - 1 : index;
      for (let f = 0; f <= upto && f < frames.length; f++) {
        if ((frames[f].messages || []).length) groups.push([frames[f], frames[f].messages]);
      }
    } else {
      groups.push(...liveTranscript);
    }
    const parts = [];
    let count = 0;
    for (const [fr, msgs] of groups) {
      parts.push('<div class="tdiv"><i></i>TURN ' + fr.turn + (fr.turn === fr.max_turns ? ' · FINAL' : '') + '<i></i></div>');
      for (const m of msgs) { parts.push(transcriptMsgHtml(m, fr)); count += 1; }
    }
    const stuck = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.innerHTML = parts.join('') || '<div class="tdiv"><i></i>NO MESSAGES YET<i></i></div>';
    document.querySelector('#tcount').textContent = count + ' MESSAGE' + (count === 1 ? '' : 'S');
    if (stuck) el.scrollTop = el.scrollHeight;
  }

  /* ---------- winner ribbon ---------- */
  let winShown = false;
  function renderWinner(frame, animate) {
    const el = document.querySelector('#winner');
    const teams = frame.teams || [];
    const feedback = frame.team_feedback || [];
    if (frame.done && teams.length === 2 && feedback.length === 2) {
      const a = feedback[0].target_score || 0, b = feedback[1].target_score || 0;
      const winner = a === b ? null : (a > b ? 0 : 1);
      el.hidden = false;
      el.style.borderColor = winner === null ? '#8a7a6a' : TEAM_ACCENTS[winner];
      el.textContent = winner === null
        ? 'DRAW · ' + fmtScore(a) + ' TO ' + fmtScore(b)
        : teams[winner].name.toUpperCase() + ' WINS · ' + fmtScore(winner ? b : a) + ' TO ' + fmtScore(winner ? a : b);
    } else if (frame.done && !teams.length && frame.image_model_feedback) {
      const fb = frame.image_model_feedback;
      el.hidden = false;
      el.style.borderColor = fb.passing ? '#2C9A55' : '#E11D48';
      el.textContent = (fb.passing ? 'PASSED · ' : 'NOT PASSING · ') + pct(fb.target_score) + '%';
    } else {
      el.hidden = true;
    }
    if (!el.hidden && !winShown && animate && MOTION) {
      el.classList.remove('hang'); void el.offsetWidth; el.classList.add('hang');
    }
    winShown = !el.hidden;
  }

  /* ---------- frame ---------- */
  function showFrame(frame, index, animate) {
    layoutSides(frame);
    renderHeader(frame);
    drawBoards(frame);
    renderPlaques(frame);
    renderBubbles(frame, index);
    renderTranscript(frame, index);
    renderWinner(frame, animate);
  }

  let lastAnimated = -1;
  function showReplayFrame(index) {
    frameIndex = Math.max(0, Math.min(frames.length - 1, Number(index)));
    const frame = frames[frameIndex];
    const animate = frameIndex !== lastAnimated;
    lastAnimated = frameIndex;
    showFrame(frame, frameIndex, animate);
    timeline.value = frameIndex;
    document.querySelector('#framelabel').textContent = 'T' + frame.turn + ' / T' + frame.max_turns;
    status.textContent = frame.done && frameIndex === frames.length - 1 ? 'REPLAY · END' : 'REPLAY';
    status.classList.remove('live');
  }
  function setPlayIcon() {
    document.querySelector('#play-icon').setAttribute('d', playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z');
  }

  function loadReplay(payload) {
    frames = payload.frames || [];
    if (payload.config && payload.config.team_models) teamModels = payload.config.team_models;
    if (!frames.length) { status.textContent = 'NO FRAMES'; return; }
    timeline.max = frames.length - 1;
    showReplayFrame(0);
    setPlayIcon();
    startPlaybackTimer();
  }

  // Replay pacing: slow enough at 1x to actually read the bubbles as it
  // plays; the SPEED button cycles the multiplier. ¼× and ½× are for
  // actually following a long exchange line by line.
  const SPEEDS = [
    { label: '¼×', ms: 8000 },
    { label: '½×', ms: 4000 },
    { label: '1×', ms: 2000 },
    { label: '2×', ms: 1000 },
    { label: '4×', ms: 500 },
  ];
  let speedIndex = 2;
  // The chosen speed sticks across visits, like the BUBBLES toggle
  // (best-effort; storage may be blocked in private mode etc.).
  try {
    const saved = SPEEDS.findIndex(s => s.label === localStorage.getItem('atelier-speed'));
    if (saved >= 0) speedIndex = saved;
  } catch (error) { /* default to 1× */ }
  document.querySelector('#speed').textContent = SPEEDS[speedIndex].label;
  function startPlaybackTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      if (!playing || !frames.length) return;
      if (frameIndex >= frames.length - 1) { playing = false; setPlayIcon(); return; }
      showReplayFrame(frameIndex + 1);
    }, SPEEDS[speedIndex].ms);
  }

  let previousLiveFrame = null;
  function handleLive(payload) {
    if (payload.team_models) teamModels = payload.team_models;
    liveFrames.push(payload);
    if ((payload.messages || []).length) liveTranscript.push([payload, payload.messages]);
    for (const key of Object.keys(liveLatest)) liveLatest[key].fresh = false;
    for (const m of payload.messages || []) liveLatest[m.slot] = { m, fresh: true };
    showFrame(payload, undefined, true);
    previousLiveFrame = payload;
    status.textContent = payload.done ? 'ENDED' : 'LIVE';
    status.classList.toggle('live', !payload.done);
    document.querySelector('#framelabel').textContent = 'T' + payload.turn + ' / T' + payload.max_turns;
    timeline.max = Math.max(0, payload.max_turns - 1); timeline.value = payload.turn - 1;
  }

  const params = new URLSearchParams(location.search);
  const replayUri = params.get('replay') || params.get('replay_uri');
  const replayMode = location.pathname.endsWith('/replay');
  // A standalone page carries its episode inline: no server, no network.
  const embedded = document.getElementById('replay-data');

  if (embedded) {
    loadReplay(JSON.parse(embedded.textContent));
  } else if (replayUri) {
    status.textContent = 'LOADING';
    fetch(replayUri)
      .then(async response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (/\.(z|gz)$/.test(new URL(replayUri, location.href).pathname)) {
          const format = replayUri.endsWith('.gz') ? 'gzip' : 'deflate';
          return new Response(response.body.pipeThrough(new DecompressionStream(format))).json();
        }
        return response.json();
      })
      .then(loadReplay)
      .catch(error => { status.textContent = 'FAILED: ' + error.message; });
  } else {
    playButton.style.visibility = 'hidden';
    timeline.disabled = true;
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const suppliedAddress = params.get('address');
    const defaultAddress = protocol + '//' + location.host + '/' + (replayMode ? 'replay' : 'global');
    const socket = new WebSocket(suppliedAddress || defaultAddress);
    socket.onopen = () => { status.textContent = replayMode ? 'LOADING' : 'LIVE · WAITING'; };
    socket.onerror = () => { status.textContent = 'NO CONNECTION'; };
    socket.onmessage = event => {
      const payload = JSON.parse(event.data);
      if (payload.type === 'replay') { playButton.style.visibility = ''; timeline.disabled = false; loadReplay(payload); }
      else if (payload.type === 'board_update') return;
      else handleLive(payload);
    };
  }

  timeline.addEventListener('input', () => {
    if (!frames.length) return;
    playing = false; setPlayIcon(); showReplayFrame(timeline.value);
  });
  playButton.addEventListener('click', () => {
    if (!playing && frames.length && frameIndex >= frames.length - 1) showReplayFrame(0);
    playing = !playing;
    setPlayIcon();
  });
  document.querySelector('#chatlog').addEventListener('click', () => {
    document.querySelector('#main').classList.toggle('chat-open');
  });
  // BUBBLES: hide every speech bubble for a clean view of the painting.
  // The choice sticks for the session (best-effort; storage may be blocked).
  try {
    if (localStorage.getItem('atelier-nobubbles') === '1') {
      document.querySelector('#main').classList.add('nobubbles');
    }
  } catch (error) { /* private mode etc. — default to visible */ }
  document.querySelector('#bubbles').addEventListener('click', () => {
    const off = document.querySelector('#main').classList.toggle('nobubbles');
    try { localStorage.setItem('atelier-nobubbles', off ? '1' : '0'); } catch (error) { /* ignore */ }
  });
  document.querySelector('#speed').addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % SPEEDS.length;
    document.querySelector('#speed').textContent = SPEEDS[speedIndex].label;
    try { localStorage.setItem('atelier-speed', SPEEDS[speedIndex].label); } catch (error) { /* ignore */ }
    if (frames.length) startPlaybackTimer();
  });
  // MORE expands one bubble to its full text; LESS collapses it back.
  document.addEventListener('click', event => {
    const more = event.target.closest('.bub .more');
    if (!more) return;
    const bub = more.closest('.bub');
    more.textContent = bub.classList.toggle('open') ? 'LESS' : 'MORE';
  });
  document.querySelector('#fullscreen').addEventListener('click', () => {
    const root = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (root.requestFullscreen) root.requestFullscreen();
  });
  window.addEventListener('resize', () => {
    fitStage();
    if (frames.length) showReplayFrame(frameIndex);
    else if (previousLiveFrame) showFrame(previousLiveFrame, undefined, false);
  });
  // The standalone build drops this button: a sandboxed page cannot hand the
  // viewer a file, so the control would be dead.
  const downloadButton = document.querySelector('#download');
  if (downloadButton) downloadButton.addEventListener('click', () => {
    const frame = frames.length ? frames[frameIndex] : previousLiveFrame;
    if (!frame) return;
    const cell = 24;
    const output = document.createElement('canvas');
    output.width = frame.width * cell; output.height = frame.height * cell;
    const ctx = output.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, output.width, output.height);
    frame.canvas.forEach((color, i) => {
      if (color === WHITE) return;
      ctx.fillStyle = color;
      ctx.fillRect((i % frame.width) * cell, Math.floor(i / frame.width) * cell, cell, cell);
    });
    const link = document.createElement('a');
    link.download = 'atelier-' + frame.target.replace(/\s+/g, '-') + '.png';
    link.href = output.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
