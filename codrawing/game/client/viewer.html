<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>co/place</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    /* The "stream" match view (design canvas: Codrawing Arena Directions,
       S1 · Stream). The paper arcade sits inside a dark video player: title,
       HP bars, the board as big as the player allows, and a row of player
       cams showing the model behind each seat. Under the player a score
       panel with the scorer's reads; on the right the two team chats. Light
       SF chrome around a Press Start arcade; every colour painted
       explicitly so the page holds on any host. */
    :root {
      --ink: #1F1B14; --paper: #FBF8F1; --rule: #D8D1C2; --muted: #8A7E6B;
      --amb: #E08A12; --teal: #1B7FAE; --red: #E11D48; --green: #2C9A55;
      --video: #0E0E10; --video-line: #3A3A40; --chrome-muted: #C9C9CF;
      --line: #E5E5EA; --grey: #53535F;
      --p8: 'Press Start 2P', ui-monospace, Menlo, monospace;
      --sf: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --chat-w: 340px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: var(--sf); overflow: hidden; -webkit-font-smoothing: antialiased; }
    a { color: var(--amb); }
    main { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) var(--chat-w); overflow: hidden; }
    .left { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #FFFFFF; }

    /* ---------- player ---------- */
    .player { flex: 1; min-height: 0; position: relative; background: var(--video); overflow: hidden; }
    .arcade {
      position: absolute; left: 0; right: 0; top: 0; bottom: 46px;
      background: var(--paper); background-image: radial-gradient(#E6DFD0 1px, transparent 1px); background-size: 14px 14px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0 14px; overflow: hidden;
    }
    .title { font-family: var(--p8); font-size: 15px; color: var(--amb); text-align: center; line-height: 1.6; flex: none; padding: 0 120px; }
    .row { width: min(1254px, calc(100% - 80px)); flex: none; }
    .bars { display: grid; grid-template-columns: 1fr 140px 1fr; gap: 28px; align-items: center; }
    .bars.solo { grid-template-columns: 1fr 140px; }
    .hp { min-width: 0; }
    .hp .line { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; }
    .hp.b .line { flex-direction: row-reverse; }
    .hp .lbl { font-family: var(--p8); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp.a .lbl { color: var(--amb); } .hp.b .lbl { color: var(--teal); }
    .hp .num { font-family: var(--p8); font-size: 14px; color: var(--ink); margin-left: auto; white-space: nowrap; }
    .hp.b .num { margin-left: 0; margin-right: auto; }
    .hp .meter { height: 22px; background: #FFFFFF; border: 3px solid var(--ink); padding: 3px; display: flex; flex-direction: row-reverse; position: relative; }
    .hp.b .meter { flex-direction: row; }
    .hp .ghost { position: absolute; top: 3px; bottom: 3px; right: 3px; background: #F3D3A6; }
    .hp.b .ghost { right: auto; left: 3px; }
    .hp .fill { position: relative; z-index: 1; transition: width .35s ease; }
    .hp.a .fill { background: linear-gradient(180deg, #FFC247, #E08A12); }
    .hp.b .fill { background: linear-gradient(180deg, #5CC8F0, #1B7FAE); }
    .hp .note { font-family: var(--p8); font-size: 7px; padding-top: 6px; color: var(--muted); white-space: nowrap; }
    .hp.b .note { text-align: right; }
    .note.down { color: var(--red); } .note.up { color: var(--green); }
    .round { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .round .n { font-family: var(--p8); font-size: 26px; color: var(--red); }
    .round .cap { font-family: var(--p8); font-size: 7px; color: var(--red); white-space: nowrap; }

    .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 0 40px; }
    .frame { position: relative; }
    .plate { position: relative; border: 5px solid var(--ink); padding: 10px; background: #FFFFFF; box-shadow: 0 18px 50px rgba(31,27,20,.18); }
    #board { display: block; image-rendering: pixelated; }
    #fx { position: absolute; left: 10px; top: 10px; pointer-events: none; }
    .stamp { position: absolute; font-family: var(--p8); font-size: 18px; text-shadow: 2px 2px 0 var(--paper); white-space: nowrap; pointer-events: none; }
    .stamp.raid { left: 28px; top: 20px; color: var(--red); transform: rotate(-6deg); }
    .stamp.win { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; background: rgba(251,248,241,.92); border: 4px solid var(--ink); padding: 14px 22px; box-shadow: 6px 6px 0 var(--rule); text-shadow: none; }
    .stamp.coord { right: 16px; bottom: 16px; font-size: 7px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 6px; text-shadow: none; }

    /* player cams */
    .cams { display: flex; justify-content: space-between; gap: 8px; }
    .cams.solo { justify-content: center; }
    .camgroup { display: flex; gap: 8px; height: 78px; }
    .cam { width: 112px; flex: none; background: #FFFFFF; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--rule); display: flex; flex-direction: column; overflow: hidden; }
    .cam .face { flex: 1; min-height: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; }
    .cam .face svg { display: block; flex: none; }
    .cam .tag { border-top: 2px solid var(--ink); padding: 5px 7px; display: flex; align-items: center; gap: 5px; font-family: var(--p8); font-size: 6px; color: var(--ink); white-space: nowrap; }
    .cam .tag i { width: 7px; height: 7px; border: 1px solid var(--ink); flex: none; display: block; }
    .cam .tag span { margin-left: auto; color: var(--muted); }
    .cam.acted .face { background: #FFFFFF; }
    .cam.collided .tag { background: #FBE3E8; }

    /* overlays + chrome */
    .turnchip { position: absolute; right: 16px; top: 14px; display: flex; align-items: center; gap: 6px; background: rgba(14,14,16,.78); color: #FFFFFF; border-radius: 4px; padding: 5px 9px; font-family: var(--sf); font-size: 13px; font-weight: 700; }
    .chrome { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: var(--video); display: flex; align-items: center; gap: 14px; padding: 0 14px; }
    .chrome button { background: transparent; border: 0; padding: 0; cursor: pointer; color: #FFFFFF; display: flex; align-items: center; }
    .chrome button svg { display: block; }
    .chrome .tlabel { font-family: var(--sf); font-size: 13px; font-weight: 600; color: #FFFFFF; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chrome .badge { font-family: var(--sf); font-size: 11px; font-weight: 600; color: var(--chrome-muted); letter-spacing: .04em; border: 1px solid var(--video-line); border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
    .chrome .badge.live { color: #FFFFFF; border-color: var(--red); background: var(--red); }
    .chrome #download { font-family: var(--sf); font-size: 11px; font-weight: 600; color: var(--chrome-muted); border: 1px solid var(--video-line); border-radius: 3px; padding: 2px 6px; }
    .chrome input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: var(--video-line); outline: none; margin: 0; cursor: pointer; }
    .chrome input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 2px var(--amb); }
    .chrome input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #FFFFFF; border: 0; box-shadow: 0 0 0 2px var(--amb); }

    /* ---------- score panel ---------- */
    .scorepanel { margin: 12px 20px; border: 1px solid var(--line); border-radius: 6px; background: #FFFFFF; padding: 14px 20px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
    .sp-head { display: flex; justify-content: space-between; align-items: baseline; }
    .sp-title { font-family: var(--sf); font-size: 16px; font-weight: 700; color: var(--ink); }
    .sp-legend { font-family: var(--p8); font-size: 7px; color: var(--muted); }
    .sp-legend .a { color: var(--amb); } .sp-legend .b { color: var(--teal); }
    .sp-grid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 28px; align-items: center; }
    .sp-grid.solo { grid-template-columns: auto minmax(0, 1fr); }
    .scorer { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
    .scorer.right { align-items: flex-end; text-align: right; }
    .scorer .k { font-family: var(--p8); font-size: 7px; color: var(--muted); }
    .scorer .v { font-family: var(--p8); font-size: 12px; }
    .scorer.a .v { color: var(--amb); } .scorer.b .v { color: var(--teal); }
    .scorer .rest { font-family: var(--p8); font-size: 7px; color: var(--muted); line-height: 1.8; }
    .chartcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    #spark { display: block; width: 100%; height: 72px; }
    .chartcol .ft { display: flex; justify-content: space-between; font-family: var(--p8); font-size: 7px; color: var(--muted); }
    .chartcol .ft .mark { color: var(--red); }

    /* ---------- chats ---------- */
    .chats { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: #FFFFFF; }
    .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .chat + .chat { border-top: 1px solid var(--line); }
    main.solo .chat.right { display: none; }
    .chat-head { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); }
    .pbadge { width: 20px; height: 20px; color: #FFFFFF; font-family: var(--p8); font-size: 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; flex: none; }
    .pbadge.a { background: var(--amb); } .pbadge.b { background: var(--teal); }
    .chat-title { font-family: var(--sf); font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-count { margin-left: auto; font-family: var(--sf); font-size: 12px; font-weight: 600; color: var(--grey); white-space: nowrap; }
    .lines { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 4px 8px; scrollbar-width: thin; }
    .divider { display: flex; align-items: center; gap: 10px; padding: 8px 10px 4px; font-family: var(--sf); font-size: 11px; font-weight: 700; color: var(--grey); letter-spacing: .06em; }
    .divider i { flex: 1; height: 1px; background: var(--line); display: block; }
    .ln { padding: 4px 10px; font-family: var(--sf); font-size: 13px; line-height: 1.45; color: var(--ink); border-radius: 4px; overflow-wrap: anywhere; }
    .ln .mark { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; vertical-align: -4px; margin-right: 4px; }
    .ln .mark svg { display: block; }
    .ln .pbadge { width: 18px; height: 18px; vertical-align: -4px; margin-right: 4px; }
    .ln .who { font-weight: 700; }
    .ln .tag { font-size: 9px; font-weight: 800; letter-spacing: .08em; margin-left: 6px; }
    .tag.raid { color: var(--red); } .tag.repair { color: var(--green); } .tag.paint { color: var(--teal); } .tag.plan { color: var(--grey); } .tag.collided { color: var(--ink); }
    .ln .txt { white-space: pre-line; }
    .sys { padding: 2px 10px; font-family: var(--sf); font-size: 11px; color: var(--grey); font-style: italic; }
    .sys.raid { color: var(--red); }

    /* ---------- motion ---------- */
    @keyframes slam { 0% { transform: rotate(-6deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-6deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }
    @keyframes slamwin { 0% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; } 60% { transform: translate(-50%, -50%) scale(.94); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    @keyframes flashred { 0% { background: #FBE3E8; } 100% { background: #FFFFFF; } }
    .stamp.raid.slam { animation: slam .45s cubic-bezier(.2,.9,.3,1.3) both; }
    .stamp.win.slam { animation: slamwin .6s cubic-bezier(.2,.9,.3,1.3) both; }
    .hp .num.chip { display: inline-block; animation: shake .4s ease both; color: var(--red); }
    .hp .meter.chip { animation: flashred .6s ease both; }
    @media (prefers-reduced-motion: reduce) { .stamp, .hp .num, .hp .meter { animation: none !important; } }

    @media (max-width: 1500px) { :root { --chat-w: 300px; } .cam { width: 92px; } .camgroup { height: 68px; } .cam .face svg { width: 26px; height: 26px; } .title { font-size: 12px; } }
    @media (max-width: 1150px) { main { grid-template-columns: minmax(0, 1fr); } .chats { display: none; } .cams { display: none; } .scorer { min-width: 0; } .scorer .rest { display: none; } }
  </style>
</head>
<body>
<main id="main">
  <div class="left">
    <div class="player" id="player">
      <div class="arcade">
        <div class="title" id="title">&nbsp;</div>
        <div class="row bars" id="bars">
          <div class="hp a" id="hp-a">
            <div class="line"><span class="lbl" id="lbl-a">1P</span><span class="num" id="num-a">&mdash;</span></div>
            <div class="meter"><div class="ghost" id="ghost-a" style="width:0"></div><div class="fill" id="fill-a" style="width:0"></div></div>
            <div class="note" id="note-a">&nbsp;</div>
          </div>
          <div class="round"><div class="n" id="turn">0</div><div class="cap" id="round-cap">ROUND 0 / 0</div></div>
          <div class="hp b" id="hp-b">
            <div class="line"><span class="lbl" id="lbl-b">2P</span><span class="num" id="num-b">&mdash;</span></div>
            <div class="meter"><div class="ghost" id="ghost-b" style="width:0"></div><div class="fill" id="fill-b" style="width:0"></div></div>
            <div class="note" id="note-b">&nbsp;</div>
          </div>
        </div>
        <div class="stage" id="stage">
          <div class="frame">
            <div class="plate"><canvas id="board"></canvas><canvas id="fx"></canvas></div>
            <div class="stamp raid" id="stamp-raid" hidden></div>
            <div class="stamp win" id="stamp-win" hidden></div>
            <div class="stamp coord" id="stamp-coord" hidden></div>
          </div>
        </div>
        <div class="row cams" id="cams"><div class="camgroup" id="cams-left"></div><div class="camgroup" id="cams-right"></div></div>
      </div>
      <div class="turnchip" id="turnchip">TURN 0 / 0</div>
      <div class="chrome">
        <button id="play" title="Play / pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="play-icon" d="M7 4l13 8-13 8z"/></svg></button>
        <input type="range" id="timeline" min="0" max="0" value="0">
        <span class="tlabel" id="framelabel">&nbsp;</span>
        <span class="badge" id="status">CONNECTING</span>
        <button id="download">PNG</button>
        <button id="fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
    </div>
    <div class="scorepanel">
      <div class="sp-head"><span class="sp-title">Score by turn</span><span class="sp-legend" id="charthint"></span></div>
      <div class="sp-grid" id="sp-grid">
        <div class="scorer a" id="scorer-a"></div>
        <div class="chartcol"><canvas id="spark"></canvas><div class="ft"><span>T1</span><span class="mark" id="chartmark"></span><span id="chartend"></span></div></div>
        <div class="scorer b right" id="scorer-b"></div>
      </div>
    </div>
  </div>
  <aside class="chats">
    <section class="chat left" id="chat-left">
      <div class="chat-head"><span class="pbadge a">1P</span><span class="chat-title" id="name-left">&nbsp;</span><span class="chat-count" id="sub-left"></span></div>
      <div class="lines" id="thread-left"></div>
    </section>
    <section class="chat right" id="chat-right">
      <div class="chat-head"><span class="pbadge b">2P</span><span class="chat-title" id="name-right">&nbsp;</span><span class="chat-count" id="sub-right"></span></div>
      <div class="lines" id="thread-right"></div>
    </section>
  </aside>
</main>
<script>
  const SEAT_COLORS = ['#FB7185', '#60A5FA', '#4ADE80', '#FBBF24', '#C084FC',
                       '#F472B6', '#2DD4BF', '#A3E635', '#818CF8', '#FB923C'];
  // The same seats, deep enough to read as text on white.
  const SEAT_INK = ['#E11D48', '#2563EB', '#16A34A', '#D97706', '#7C3AED',
                    '#DB2777', '#0D9488', '#65A30D', '#4F46E5', '#EA580C'];
  const TEAM_COLORS = ['#E08A12', '#1B7FAE'];

  function sparks(x, y, color) {
    const now = performance.now();
    particles.push({ kind: 'ring', born: now, life: 320, x: x + 0.5, y: y + 0.5, s0: 1, grow: 1.8, color: color, alpha: 0.9, width: 0.16 });
    puff(x, y, { count: 8, life: [260, 480], drift: 2.6, rise: [-2.2, 1.2], size: [0.16, 0.3], grow: -0.1, colors: [color, '#FFFFFF'], alpha: 0.95 });
  }
  function ring(x, y, color) {
    particles.push({ kind: 'ring', born: performance.now(), life: 520, x: x + 0.5, y: y + 0.5, s0: 1.1, grow: 1.4, color: color, alpha: 0.9, width: 0.14 });
  }
  function spawnEffects(frame, previous, changed) {
    if (!MOTION || !previous) return;
    for (const i of changed) {
      const x = i % frame.width, y = Math.floor(i / frame.width);
      const owner = frame.owners ? frame.owners[i] : -1;
      const seat = owner >= 0 ? SEAT_COLORS[owner % SEAT_COLORS.length] : '#1F1B14';
      const raid = isAttack(frame, owner, i);
      if (frame.canvas[i] === WHITE) smokeBomb(x, y);
      else if (raid) sparks(x, y, '#E11D48');
      else ring(x, y, seat);
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(fxTick);
  }
  function fxTick(now) {
    fxRaf = 0;
    const scale = window.devicePixelRatio || 1;
    fxCtx.setTransform(scale, 0, 0, scale, 0, 0);
    fxCtx.clearRect(0, 0, fxSize.w, fxSize.h);
    const cell = fxCell;
    const keep = [];
    for (const p of particles) {
      const age = now - p.born;
      if (age < 0) { keep.push(p); continue; }
      const t = age / p.life;
      if (t >= 1) continue;
      keep.push(p);
      const ease = 1 - (1 - t) * (1 - t);
      const px = (p.x + (p.vx || 0) * ease * p.life / 1000) * cell;
      const py = (p.y + (p.vy || 0) * ease * p.life / 1000) * cell;
      const size = Math.max(1, (p.s0 + p.grow * ease) * cell);
      fxCtx.globalAlpha = Math.max(0, p.alpha * (1 - t));
      if (p.kind === 'ring') {
        fxCtx.strokeStyle = p.color; fxCtx.lineWidth = Math.max(1.5, p.width * cell);
        fxCtx.strokeRect(Math.round(px - size / 2) + 0.5, Math.round(py - size / 2) + 0.5, Math.round(size), Math.round(size));
      } else {
        fxCtx.fillStyle = p.color;
        const q = Math.max(1, cell / 4);
        const sx = Math.round((px - size / 2) / q) * q, sy = Math.round((py - size / 2) / q) * q;
        fxCtx.fillRect(sx, sy, Math.round(size / q) * q || q, Math.round(size / q) * q || q);
      }
    }
    fxCtx.globalAlpha = 1;
    particles = keep;
    if (particles.length) fxRaf = requestAnimationFrame(fxTick);
  }
  function retrigger(el, cls) {
    if (!MOTION) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  /* ---------- board ---------- */
  function drawBoard(frame, previous) {
    const stage = document.querySelector('#stage');
    const avail = { w: stage.clientWidth - 80 - 30, h: stage.clientHeight - 30 };
    const cell = Math.max(4, Math.floor(Math.min(avail.w / frame.width, avail.h / frame.height)));
    const size = { w: frame.width * cell + 1, h: frame.height * cell + 1 };
    const scale = window.devicePixelRatio || 1;
    board.width = size.w * scale; board.height = size.h * scale;
    board.style.width = size.w + 'px'; board.style.height = size.h + 'px';
    fx.width = size.w * scale; fx.height = size.h * scale;
    fx.style.width = size.w + 'px'; fx.style.height = size.h + 'px';
    fxCell = cell; fxSize = size;
    if (particles.length && !fxRaf) fxRaf = requestAnimationFrame(fxTick);
    boardCtx.setTransform(scale, 0, 0, scale, 0, 0);
    boardCtx.fillStyle = '#F7F4EC';
    boardCtx.fillRect(0, 0, size.w, size.h);
    const teams = frame.teams || [];
    if (teams.length === 2) {
      teams.forEach((team, k) => {
        boardCtx.fillStyle = TEAM_COLORS[k];
        boardCtx.globalAlpha = 0.09;
        boardCtx.fillRect(team.region.x * cell, team.region.y * cell, team.region.width * cell, team.region.height * cell);
        boardCtx.globalAlpha = 1;
      });
    }
    boardCtx.strokeStyle = 'rgba(38,34,26,0.08)';
    boardCtx.lineWidth = 1;
    for (let x = 0; x <= frame.width; x++) {
      boardCtx.beginPath(); boardCtx.moveTo(x * cell + 0.5, 0); boardCtx.lineTo(x * cell + 0.5, size.h); boardCtx.stroke();
    }
    for (let y = 0; y <= frame.height; y++) {
      boardCtx.beginPath(); boardCtx.moveTo(0, y * cell + 0.5); boardCtx.lineTo(size.w, y * cell + 0.5); boardCtx.stroke();
    }
    const gap = Math.max(1, Math.round(cell * 0.12));
    for (let i = 0; i < frame.canvas.length; i++) {
      const color = frame.canvas[i];
      if (color === WHITE) continue;
      const x = i % frame.width, y = Math.floor(i / frame.width);
      boardCtx.fillStyle = color;
      boardCtx.fillRect(x * cell + gap, y * cell + gap, cell - 2 * gap + 1, cell - 2 * gap + 1);
      const owner = frame.owners ? frame.owners[i] : -1;
      if (owner >= 0 && cell >= 14) {
        const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
        boardCtx.fillStyle = 0.299 * r + 0.587 * g + 0.114 * b > 140 ? 'rgba(31,27,20,.55)' : 'rgba(255,255,255,.7)';
        boardCtx.font = '700 ' + Math.max(7, Math.floor(cell * 0.4)) + 'px ui-monospace, Menlo, monospace';
        boardCtx.textAlign = 'center'; boardCtx.textBaseline = 'middle';
        boardCtx.fillText(String(owner), x * cell + cell / 2 + 0.5, y * cell + cell / 2 + 1);
      }
    }
    if (teams.length === 2) {
      const seam = teams[1].region.x * cell + 0.5;
      boardCtx.strokeStyle = 'rgba(11,15,20,0.55)';
      boardCtx.lineWidth = 2;
      boardCtx.setLineDash([7, 5]);
      boardCtx.beginPath(); boardCtx.moveTo(seam, 0); boardCtx.lineTo(seam, size.h); boardCtx.stroke();
      boardCtx.setLineDash([]);
    }
    // Squares held by the other side; an erased one shows as a cross.
    (frame.owners || []).forEach((owner, i) => {
      if (!isAttack(frame, owner, i)) return;
      const x = (i % frame.width) * cell, y = Math.floor(i / frame.width) * cell;
      boardCtx.strokeStyle = '#E11D48';
      boardCtx.lineWidth = Math.max(1, cell * 0.14);
      boardCtx.strokeRect(x + gap + 0.5, y + gap + 0.5, cell - 2 * gap, cell - 2 * gap);
      if (frame.canvas[i] === WHITE) {
        const p = Math.max(2, cell * 0.3);
        boardCtx.beginPath();
        boardCtx.moveTo(x + p, y + p); boardCtx.lineTo(x + cell - p, y + cell - p);
        boardCtx.moveTo(x + cell - p, y + p); boardCtx.lineTo(x + p, y + cell - p);
        boardCtx.stroke();
      }
    });
    // This turn's writes, ringed in the painter's seat colour, on top.
    const changed = writesOf(frame, previous);
    if (previous) {
      boardCtx.lineWidth = Math.max(1.5, cell * 0.18);
      for (const i of changed) {
        const owner = frame.owners ? frame.owners[i] : -1;
        const x = i % frame.width, y = Math.floor(i / frame.width);
        boardCtx.strokeStyle = owner >= 0 ? SEAT_COLORS[owner % SEAT_COLORS.length] : '#1F1B14';
        boardCtx.strokeRect(x * cell - 1.5, y * cell - 1.5, cell + 3, cell + 3);
      }
    }
    return changed;
  }

  let winShown = false;
  function renderStamps(frame, changed, animate) {
    const raids = changed.filter(i => isAttack(frame, frame.owners ? frame.owners[i] : -1, i)).length;
    const raid = document.querySelector('#stamp-raid');
    raid.hidden = !raids;
    raid.textContent = 'RAID ×' + raids;
    if (raids && animate) retrigger(raid, 'slam');
    const teams = frame.teams || [];
    const win = document.querySelector('#stamp-win');
    const feedback = frame.team_feedback || [];
    if (frame.done && teams.length === 2 && feedback.length === 2) {
      const a = feedback[0].target_score || 0, b = feedback[1].target_score || 0;
      const winner = a === b ? null : (a > b ? 0 : 1);
      win.hidden = false;
      win.style.color = winner === null ? 'var(--muted)' : (winner ? 'var(--teal)' : 'var(--amb)');
      win.textContent = winner === null ? 'DRAW · ' + pct(a) + ' TO ' + pct(b)
        : (winner ? '2P' : '1P') + ' WINS · ' + pct(winner ? b : a) + ' TO ' + pct(winner ? a : b);
    } else if (frame.done && !teams.length && frame.image_model_feedback) {
      const fb = frame.image_model_feedback;
      win.hidden = false;
      win.style.color = fb.passing ? 'var(--green)' : 'var(--red)';
      win.textContent = (fb.passing ? 'PASSED · ' : 'NOT PASSING · ') + pct(fb.target_score) + '%';
    } else {
      win.hidden = true;
    }
    if (!win.hidden && !winShown && animate) retrigger(win, 'slam');
    winShown = !win.hidden;
    const coord = document.querySelector('#stamp-coord');
    if (changed.length && changed.length < 12) {
      coord.hidden = false;
      coord.textContent = changed.map(i => '(' + (i % frame.width) + ', ' + Math.floor(i / frame.width) + ')').join('  ');
    } else {
      coord.hidden = true;
    }
  }

  /* ---------- score chart + video timeline ---------- */
  function raidTurns(list) {
    const out = [];
    for (let f = 1; f < list.length; f++) {
      const cur = list[f], prev = list[f - 1];
      let hit = false;
      for (let i = 0; i < cur.canvas.length && !hit; i++) {
        if (prev.canvas[i] !== cur.canvas[i] && isAttack(cur, cur.owners ? cur.owners[i] : -1, i)) hit = true;
      }
      if (hit) out.push(f);
    }
    return out;
  }
  function drawSpark(series, currentIndex, colors, raids, total) {
    const scale = window.devicePixelRatio || 1;
    const w = spark.clientWidth || 400, h = Math.max(40, spark.clientHeight || 72);
    spark.width = w * scale; spark.height = h * scale;
    const ctx = spark.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pad = { l: 2, r: 2, t: 4, b: 4 };
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const length = Math.max(total || 0, ...series.map(s => s.length), 2);
    const max = Math.max(0.05, ...series.flat());
    const x = i => pad.l + (i / (length - 1)) * plotW;
    const y = v => pad.t + plotH - (v / max) * plotH;
    ctx.fillStyle = 'rgba(225,29,72,0.12)';
    (raids || []).forEach(f => ctx.fillRect(x(f - 1), pad.t, Math.max(1, x(f) - x(f - 1)), plotH));
    ctx.strokeStyle = '#D8D1C2'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t + 1); ctx.lineTo(w - pad.r, pad.t + 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t + plotH - 1); ctx.lineTo(w - pad.r, pad.t + plotH - 1); ctx.stroke();
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(pad.l, y(max / 2)); ctx.lineTo(w - pad.r, y(max / 2)); ctx.stroke();
    ctx.setLineDash([]);
    series.forEach((scores, k) => {
      if (!scores.length) return;
      ctx.strokeStyle = (colors && colors[k]) || '#E08A12'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath();
      scores.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
      ctx.stroke();
    });
    const upto = currentIndex === undefined ? Math.max(...series.map(s => s.length)) - 1 : currentIndex;
    ctx.strokeStyle = '#1F1B14'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x(upto), pad.t - 3); ctx.lineTo(x(upto), pad.t + plotH + 3); ctx.stroke();
    series.forEach((scores, k) => {
      if (!scores.length) return;
      const i = Math.min(upto, scores.length - 1);
      ctx.fillStyle = (colors && colors[k]) || '#E08A12';
      ctx.beginPath(); ctx.arc(x(i), y(scores[i]), 4, 0, 2 * Math.PI); ctx.fill();
    });
  }
  // The scrubber paints like a video timeline: played part amber, the turns
  // with a raid in red, the rest of the match dark.
  function paintTimeline(played, raids, total) {
    const n = Math.max(total, 2);
    const at = f => (100 * f / (n - 1)).toFixed(2) + '%';
    const base = 'linear-gradient(90deg, #E08A12 0%, #E08A12 ' + at(played) + ', #3A3A40 ' + at(played) + ', #3A3A40 100%)';
    const reds = (raids || []).map(f => 'linear-gradient(90deg, transparent ' + at(f - 1) + ', #E11D48 ' + at(f - 1) + ', #E11D48 ' + at(f) + ', transparent ' + at(f) + ')');
    timeline.style.background = [...reds, base].join(', ');
  }

  /* ---------- frame ---------- */
  function showFrame(frame, previous, series, scoreIndex, list, animate) {
    layoutSeats(frame);
    renderBand(frame, previous, animate);
    const changed = drawBoard(frame, previous);
    if (animate) spawnEffects(frame, previous, changed);
    renderStamps(frame, changed, animate);
    renderCams(frame);
    renderThreads(frame, scoreIndex);
    renderScorer(frame);
    const teams = frame.teams || [];
    const raids = raidTurns(list || []);
    drawSpark(series, scoreIndex, teams.length ? TEAM_COLORS : null, raids, frame.max_turns);
    const scores = teams.length ? teams.map((_, k) => ((frame.team_feedback || [])[k] || {}).target_score || 0) : [];
    document.querySelector('#charthint').innerHTML = teams.length
      ? '<span class="a">1P ' + pct(scores[0]) + '</span> vs <span class="b">2P ' + pct(scores[1]) + '</span> · red = a raid turn · only T' + frame.max_turns + ' counts'
      : esc(frame.target || '');
    const firstRaid = raids.length ? list[raids[0]].turn : null;
    document.querySelector('#chartmark').textContent = firstRaid ? 'T' + firstRaid + ' · FIRST RAID' : '';
    document.querySelector('#chartend').textContent = 'T' + frame.max_turns;
    paintTimeline(scoreIndex === undefined ? (list ? list.length - 1 : 0) : scoreIndex, raids, frame.max_turns);
  }

  function replayScores() {
    const teams = (frames[0] && frames[0].teams) || [];
    if (teams.length) {
      return teams.map((_, k) => frames.map(f => ((f.team_feedback || [])[k] || {}).target_score || 0));
    }
    return [frames.map(f => (f.image_model_feedback ? f.image_model_feedback.target_score : 0))];
  }

  let lastAnimated = -1;
  function showReplayFrame(index) {
    frameIndex = Math.max(0, Math.min(frames.length - 1, Number(index)));
    const frame = frames[frameIndex];
    const animate = frameIndex !== lastAnimated;
    lastAnimated = frameIndex;
    showFrame(frame, frameIndex > 0 ? frames[frameIndex - 1] : null, replayScores(), frameIndex, frames, animate);
    timeline.value = frameIndex;
    document.querySelector('#framelabel').textContent = 'T' + frame.turn + ' / T' + frame.max_turns;
    status.textContent = frame.done && frameIndex === frames.length - 1 ? 'REPLAY · END' : 'REPLAY';
    status.classList.remove('live');
  }
  function setPlayIcon() {
    document.querySelector('#play-icon').setAttribute('d', playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z');
  }

  function loadReplay(payload) {
    frames = payload.frames || [];
    if (payload.config && payload.config.team_models) teamModels = payload.config.team_models;
    if (!frames.length) { status.textContent = 'NO FRAMES'; return; }
    timeline.max = frames.length - 1;
    showReplayFrame(0);
    setPlayIcon();
    clearInterval(timer);
    timer = setInterval(() => {
      if (!playing || !frames.length) return;
      if (frameIndex >= frames.length - 1) { playing = false; setPlayIcon(); return; }
      showReplayFrame(frameIndex + 1);
    }, 800);
  }

  let previousLiveFrame = null;
  function handleLive(payload) {
    if (payload.team_models) teamModels = payload.team_models;
    const values = payload.team_feedback
      ? payload.team_feedback.map(f => f.target_score || 0)
      : payload.image_model_feedback ? [payload.image_model_feedback.target_score] : [];
    values.forEach((value, k) => {
      liveScores[k] = liveScores[k] || [];
      liveScores[k].push(value);
    });
    liveFrames.push(payload);
    layoutSeats(payload);
    [['left', seatLayout.left], ['right', seatLayout.right]].forEach(([side, slots]) => {
      if (slots.length) liveThreads[side].push(threadHtml(payload, previousLiveFrame, slots));
    });
    showFrame(payload, previousLiveFrame, liveScores, undefined, liveFrames, true);
    previousLiveFrame = payload;
    status.textContent = payload.done ? 'ENDED' : 'LIVE';
    status.classList.toggle('live', !payload.done);
    document.querySelector('#framelabel').textContent = 'T' + payload.turn + ' / T' + payload.max_turns;
    timeline.max = Math.max(0, payload.max_turns - 1); timeline.value = payload.turn - 1;
  }

  const params = new URLSearchParams(location.search);
  const replayUri = params.get('replay') || params.get('replay_uri');
  const replayMode = location.pathname.endsWith('/replay');
  // A standalone page carries its episode inline: no server, no network.
  const embedded = document.getElementById('replay-data');

  if (embedded) {
    loadReplay(JSON.parse(embedded.textContent));
  } else if (replayUri) {
    status.textContent = 'LOADING';
    fetch(replayUri)
      .then(async response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (/\.(z|gz)$/.test(new URL(replayUri, location.href).pathname)) {
          const format = replayUri.endsWith('.gz') ? 'gzip' : 'deflate';
          return new Response(response.body.pipeThrough(new DecompressionStream(format))).json();
        }
        return response.json();
      })
      .then(loadReplay)
      .catch(error => { status.textContent = 'FAILED: ' + error.message; });
  } else {
    playButton.style.visibility = 'hidden';
    timeline.disabled = true;
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const suppliedAddress = params.get('address');
    const defaultAddress = protocol + '//' + location.host + '/' + (replayMode ? 'replay' : 'global');
    const socket = new WebSocket(suppliedAddress || defaultAddress);
    socket.onopen = () => { status.textContent = replayMode ? 'LOADING' : 'LIVE · WAITING'; };
    socket.onerror = () => { status.textContent = 'NO CONNECTION'; };
    socket.onmessage = event => {
      const payload = JSON.parse(event.data);
      if (payload.type === 'replay') { playButton.style.visibility = ''; timeline.disabled = false; loadReplay(payload); }
      else if (payload.type === 'board_update') return;
      else handleLive(payload);
    };
  }

  timeline.addEventListener('input', () => {
    if (!frames.length) return;
    playing = false; setPlayIcon(); showReplayFrame(timeline.value);
  });
  playButton.addEventListener('click', () => {
    if (!playing && frames.length && frameIndex >= frames.length - 1) showReplayFrame(0);
    playing = !playing;
    setPlayIcon();
  });
  document.querySelector('#fullscreen').addEventListener('click', () => {
    const player = document.querySelector('#player');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (player.requestFullscreen) player.requestFullscreen();
  });
  window.addEventListener('resize', () => {
    if (frames.length) showReplayFrame(frameIndex);
    else if (previousLiveFrame) showFrame(previousLiveFrame, null, liveScores, undefined, liveFrames);
  });
  // The standalone build drops this button: a sandboxed page cannot hand the
  // viewer a file, so the control would be dead.
  const downloadButton = document.querySelector('#download');
  if (downloadButton) downloadButton.addEventListener('click', () => {
    const frame = frames.length ? frames[frameIndex] : previousLiveFrame;
    if (!frame) return;
    const cell = 24;
    const output = document.createElement('canvas');
    output.width = frame.width * cell; output.height = frame.height * cell;
    const ctx = output.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, output.width, output.height);
    frame.canvas.forEach((color, i) => {
      if (color === WHITE) return;
      ctx.fillStyle = color;
      ctx.fillRect((i % frame.width) * cell, Math.floor(i / frame.width) * cell, cell, cell);
    });
    const link = document.createElement('a');
    link.download = 'coplace-' + frame.target.replace(/\s+/g, '-') + '.png';
    link.href = output.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
