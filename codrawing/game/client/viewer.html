<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>co/place</title>
  <style>
    :root { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #FAF7F0; color: #26221A; overflow: hidden; }
    main { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 12px 16px; gap: 10px; max-width: 1400px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: baseline; }
    header h1 { font-size: 20px; margin: 0; }
    header .sub { color: #7A7466; font-size: 12.5px; }
    #feedback { font-size: 12.5px; color: #7A7466; width: 100%; }
    #feedback .pass { color: #15803D; font-weight: 700; }
    #feedback .fail { color: #B91C1C; font-weight: 700; }
    .content { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(340px, 460px); gap: 16px; min-height: 0; }
    .boardpane { display: flex; flex-direction: column; min-height: 0; background: #FFFFFF; border: 1px solid #D8D2C4; border-radius: 8px; padding: 10px 14px; }
    .boardpane .paneheader { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #E9E3D6; padding-bottom: 8px; }
    .boardbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas#board { display: block; }
    #lastaction { font-size: 11.5px; color: #7A7466; border-top: 1px solid #E9E3D6; padding-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #spark { width: 100%; height: 54px; display: block; }
    .robots { display: grid; grid-auto-rows: 1fr; gap: 8px; min-height: 0; }
    .robotrow { display: grid; grid-template-columns: 64px 1fr; gap: 4px; align-items: center; min-height: 0; }
    .robotrow svg { width: 58px; height: 58px; display: block; margin: 0 auto; }
    .bubble { position: relative; background: #FFFFFF; border: 1.5px solid #26221A; border-radius: 10px; padding: 6px 9px; font-size: 11px; line-height: 1.45; max-height: 100%; overflow-y: auto; }
    .bubble::before { content: ""; position: absolute; left: -8px; top: 22px; width: 12px; height: 12px; background: #FFFFFF; border-left: 1.5px solid #26221A; border-bottom: 1.5px solid #26221A; transform: rotate(45deg); }
    .bubble.quiet { border-color: #D8D2C4; color: #A8A193; }
    .bubble.quiet::before { border-color: #D8D2C4; }
    .bubble .say { display: block; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .controls button { font: inherit; color: #26221A; background: #FFFFFF; border: 1px solid #D8D2C4; border-radius: 4px; padding: 4px 14px; cursor: pointer; }
    .controls button:hover { border-color: #7A7466; }
    .controls input[type="range"] { flex: 1; accent-color: #B45309; }
    .turnlabel { min-width: 90px; text-align: right; font-size: 12.5px; }
    #status { color: #7A7466; font-size: 12px; }
    @media (max-width: 780px) {
      body { overflow: auto; }
      main { height: auto; }
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>co/place</h1>
    <span class="sub">Target: <strong id="target">&mdash;</strong> &middot; <span id="roundlabel"></span>Turn <span id="turn">0</span>/<span id="max-turns">0</span> &middot; <span id="status">Connecting&hellip;</span></span>
    <div id="feedback">waiting for classifier&hellip;</div>
  </header>

  <div class="content">
    <section class="boardpane">
      <div class="paneheader"><span id="canvastitle">Canvas</span><span id="framestamp" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div class="boardbox"><canvas id="board"></canvas></div>
      <div id="lastaction">&mdash;</div>
      <canvas id="spark"></canvas>
    </section>
    <section class="robots" id="robots"></section>
  </div>

  <div class="controls">
    <button id="play">Pause</button>
    <input type="range" id="timeline" min="0" max="0" value="0">
    <span class="turnlabel" id="framelabel"></span>
    <button id="download">PNG</button>
  </div>
</main>
<script>
  const SEAT_COLORS = ['#EF4444', '#3B82F6', '#22C55E', '#F59E0B', '#A855F7',
                       '#EC4899', '#14B8A6', '#84CC16', '#6366F1', '#F97316'];
  const TEAM_COLORS = ['#D97706', '#3B82F6'];
  const WHITE = '#FFFFFF';
  const board = document.querySelector('#board');
  const boardCtx = board.getContext('2d');
  const spark = document.querySelector('#spark');
  const robotsPane = document.querySelector('#robots');
  const status = document.querySelector('#status');
  const timeline = document.querySelector('#timeline');
  const playButton = document.querySelector('#play');
  let frames = [], frameIndex = 0, playing = true, timer = null;
  let liveScores = [];

  function esc(value) {
    const node = document.createElement('div'); node.textContent = value; return node.innerHTML;
  }

  function robotSvg(color, index) {
    return '<svg viewBox="0 0 64 64" aria-label="robot seat ' + index + '">' +
      '<line x1="32" y1="10" x2="32" y2="4" stroke="#26221A" stroke-width="2"/>' +
      '<circle cx="32" cy="4" r="2.6" fill="' + color + '" stroke="#26221A" stroke-width="1.4"/>' +
      '<rect x="14" y="10" width="36" height="26" rx="7" fill="' + color + '" stroke="#26221A" stroke-width="2"/>' +
      '<circle cx="25" cy="22" r="5" fill="#FFFFFF" stroke="#26221A" stroke-width="1.6"/>' +
      '<circle cx="39" cy="22" r="5" fill="#FFFFFF" stroke="#26221A" stroke-width="1.6"/>' +
      '<circle cx="25.8" cy="22.8" r="1.9" fill="#26221A"/>' +
      '<circle cx="39.8" cy="22.8" r="1.9" fill="#26221A"/>' +
      '<rect x="25" y="29" width="14" height="2.6" rx="1.3" fill="#26221A"/>' +
      '<rect x="10" y="20" width="4" height="8" rx="2" fill="' + color + '" stroke="#26221A" stroke-width="1.4"/>' +
      '<rect x="50" y="20" width="4" height="8" rx="2" fill="' + color + '" stroke="#26221A" stroke-width="1.4"/>' +
      '<rect x="20" y="38" width="24" height="16" rx="4" fill="' + color + '" stroke="#26221A" stroke-width="2"/>' +
      '<rect x="27" y="42" width="10" height="5" rx="1.5" fill="#FFFFFF" stroke="#26221A" stroke-width="1.2"/>' +
      '<rect x="24" y="56" width="6" height="5" rx="1.5" fill="#26221A"/>' +
      '<rect x="34" y="56" width="6" height="5" rx="1.5" fill="#26221A"/>' +
      '</svg>';
  }

  function initRobots(count) {
    robotsPane.innerHTML = Array.from({ length: count }, (_, index) =>
      '<div class="robotrow">' + robotSvg(SEAT_COLORS[index % SEAT_COLORS.length], index) +
      '<div class="bubble quiet" id="bubble-' + index + '"><span class="say">&hellip;</span></div></div>'
    ).join('');
  }
  initRobots(5);

  function renderBubbles(frame) {
    const count = (frame.player_names || []).length || 5;
    if (robotsPane.children.length !== count) initRobots(count);
    const messageBySlot = {};
    for (const m of frame.messages || []) messageBySlot[m.slot] = m.text;
    for (let i = 0; i < count; i++) {
      const bubble = document.querySelector('#bubble-' + i);
      const text = messageBySlot[i];
      if (text) {
        bubble.classList.remove('quiet');
        bubble.innerHTML = '<span class="say">' + esc(text) + '</span>';
      } else {
        bubble.classList.add('quiet');
        bubble.innerHTML = '<span class="say">(silent this turn)</span>';
      }
    }
  }

  function drawBoard(frame, previous) {
    const box = document.querySelector('.boardbox');
    // Fit both axes: a versus canvas is twice as wide as it is tall.
    const cell = Math.max(
      6,
      Math.floor(Math.min((box.clientWidth - 8) / frame.width, (box.clientHeight - 8) / frame.height))
    );
    const size = { w: frame.width * cell + 1, h: frame.height * cell + 1 };
    const scale = window.devicePixelRatio || 1;
    board.width = size.w * scale; board.height = size.h * scale;
    board.style.width = size.w + 'px'; board.style.height = size.h + 'px';
    boardCtx.setTransform(scale, 0, 0, scale, 0, 0);
    boardCtx.fillStyle = '#FFFFFF';
    boardCtx.fillRect(0, 0, size.w, size.h);
    boardCtx.strokeStyle = '#E9E3D6';
    boardCtx.lineWidth = 1;
    for (let x = 0; x <= frame.width; x++) {
      boardCtx.beginPath(); boardCtx.moveTo(x * cell + 0.5, 0); boardCtx.lineTo(x * cell + 0.5, size.h); boardCtx.stroke();
    }
    for (let y = 0; y <= frame.height; y++) {
      boardCtx.beginPath(); boardCtx.moveTo(0, y * cell + 0.5); boardCtx.lineTo(size.w, y * cell + 0.5); boardCtx.stroke();
    }
    const changed = [];
    boardCtx.textAlign = 'center';
    boardCtx.textBaseline = 'middle';
    for (let i = 0; i < frame.canvas.length; i++) {
      const color = frame.canvas[i];
      const x = i % frame.width, y = Math.floor(i / frame.width);
      if (color !== WHITE) {
        boardCtx.fillStyle = color;
        boardCtx.fillRect(x * cell + 2, y * cell + 2, cell - 3, cell - 3);
        const owner = frame.owners ? frame.owners[i] : -1;
        if (owner >= 0 && cell >= 10) {
          const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
          boardCtx.fillStyle = 0.299 * r + 0.587 * g + 0.114 * b > 140 ? '#26221A' : '#FFFFFF';
          boardCtx.font = '700 ' + Math.max(8, Math.floor(cell * 0.45)) + 'px ui-monospace, Menlo, monospace';
          boardCtx.fillText(String(owner + 1), x * cell + cell / 2 + 0.5, y * cell + cell / 2 + 1);
        }
      }
      if (previous && previous.canvas[i] !== color) changed.push(i);
    }
    // Seam between the two independently scored halves of a versus canvas.
    const teams = frame.teams || [];
    if (teams.length === 2) {
      const seam = teams[1].region.x * cell + 0.5;
      boardCtx.strokeStyle = '#7A7466';
      boardCtx.lineWidth = 2;
      boardCtx.beginPath(); boardCtx.moveTo(seam, 0); boardCtx.lineTo(seam, size.h); boardCtx.stroke();
    }
    boardCtx.strokeStyle = '#26221A';
    boardCtx.lineWidth = 2;
    for (const i of changed) {
      const x = i % frame.width, y = Math.floor(i / frame.width);
      boardCtx.strokeRect(x * cell + 1.5, y * cell + 1.5, cell - 2, cell - 2);
    }
    const names = frame.player_names || [];
    const acts = changed.map(i => {
      const owner = frame.owners ? frame.owners[i] : null;
      const who = owner === null || owner === undefined || owner < 0 ? 'someone' : 'seat ' + owner;
      const verb = frame.canvas[i] === WHITE ? 'erased' : 'painted';
      return who + ' ' + verb + ' (' + (i % frame.width) + ',' + Math.floor(i / frame.width) + ')';
    });
    document.querySelector('#lastaction').textContent = acts.length ? acts.join(' · ') : 'no accepted writes this turn';
    document.querySelector('#canvastitle').textContent = 'Canvas ' + frame.width + '×' + frame.height;
  }

  function drawSpark(series, threshold, currentIndex, turnsPerRound, colors) {
    const scale = window.devicePixelRatio || 1;
    const w = spark.clientWidth || 500, h = 54;
    spark.width = w * scale; spark.height = h * scale;
    spark.style.height = h + 'px';
    const ctx = spark.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pad = { l: 4, r: 46, t: 8, b: 6 };
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const length = Math.max(...series.map(s => s.length), 1);
    const max = Math.max(0.05, ...series.flat());
    const x = i => pad.l + (length > 1 ? (i / (length - 1)) * plotW : plotW / 2);
    const y = v => pad.t + plotH - (v / max) * plotH;
    ctx.font = '10px ui-monospace, Menlo, monospace';
    if (turnsPerRound && turnsPerRound < length - 1) {
      ctx.strokeStyle = '#EFE9DC';
      for (let t = turnsPerRound; t < length - 1; t += turnsPerRound) {
        ctx.beginPath(); ctx.moveTo(x(t), pad.t); ctx.lineTo(x(t), pad.t + plotH); ctx.stroke();
      }
    }
    if (threshold && threshold <= max) {
      ctx.strokeStyle = '#B0A896';
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(pad.l, y(threshold)); ctx.lineTo(w - pad.r, y(threshold)); ctx.stroke();
      ctx.setLineDash([]);
    }
    series.forEach((scores, k) => {
      if (!scores.length) return;
      const color = (colors && colors[k]) || '#B45309';
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      scores.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
      ctx.stroke();
      const i = Math.min(currentIndex === undefined ? scores.length - 1 : currentIndex, scores.length - 1);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x(i), y(scores[i]), 3, 0, 2 * Math.PI); ctx.fill();
      ctx.fillText((100 * scores[i]).toFixed(1) + '%', w - pad.r + 5, y(scores[i]) + 3);
    });
  }

  function renderFeedback(feedback, frame) {
    const el = document.querySelector('#feedback');
    const teamFeedback = (frame && frame.team_feedback) || null;
    if (teamFeedback && teamFeedback.length === 2) {
      const best = Math.max(...teamFeedback.map(f => f.target_score || 0));
      el.innerHTML = teamFeedback.map((f, k) =>
        '<span style="color:' + TEAM_COLORS[k] + '">&#9632;</span> ' + esc(f.name) +
        ' &middot; ' + esc(f.target) + ' <strong class="' + ((f.target_score || 0) === best ? 'pass' : '') + '">' +
        (100 * (f.target_score || 0)).toFixed(1) + '%</strong>' +
        ' (&Delta; ' + (100 * (f.score_delta || 0)).toFixed(1) + ')'
      ).join(' &nbsp;|&nbsp; ') + ' &middot; the FINAL turn decides the winner';
      return;
    }
    if (!feedback) { el.textContent = 'Image-model feedback: unavailable'; return; }
    el.innerHTML =
      '<span class="' + (feedback.passing ? 'pass' : 'fail') + '">' + (feedback.passing ? 'PASSING' : 'NOT PASSING') + '</span>' +
      ' · ' + esc(feedback.model) + ' score <strong>' + (100 * feedback.target_score).toFixed(2) + '%</strong>' +
      ' (need &gt;' + (100 * feedback.pass_threshold).toFixed(0) + '%)' +
      ' · Δ ' + (100 * feedback.score_delta).toFixed(3) + '%' +
      ' · rank ' + feedback.target_rank + (feedback.label_count ? '/' + feedback.label_count : '');
  }

  function showFrame(frame, previous, series, scoreIndex) {
    const teams = frame.teams || [];
    document.querySelector('#target').textContent =
      teams.length ? teams.map(t => t.target).join(' vs ') : frame.target;
    document.querySelector('#turn').textContent = frame.turn;
    document.querySelector('#max-turns').textContent = frame.max_turns;
    document.querySelector('#roundlabel').textContent =
      frame.rounds > 1 ? 'Round ' + frame.round + '/' + frame.rounds + ' · ' : '';
    drawBoard(frame, previous);
    renderFeedback(frame.image_model_feedback, frame);
    renderBubbles(frame);
    // A versus episode has no single pass threshold; the higher final score wins.
    const threshold = teams.length || !frame.image_model_feedback
      ? 0
      : frame.image_model_feedback.pass_threshold;
    drawSpark(series, threshold, scoreIndex, frame.turns_per_round, teams.length ? TEAM_COLORS : null);
  }

  function replayScores() {
    const teams = (frames[0] && frames[0].teams) || [];
    if (teams.length) {
      return teams.map((_, k) =>
        frames.map(f => ((f.team_feedback || [])[k] || {}).target_score || 0));
    }
    return [frames.map(f => (f.image_model_feedback ? f.image_model_feedback.target_score : 0))];
  }

  function showReplayFrame(index) {
    frameIndex = Math.max(0, Math.min(frames.length - 1, Number(index)));
    const frame = frames[frameIndex];
    const previous = frameIndex > 0 ? frames[frameIndex - 1] : null;
    showFrame(frame, previous, replayScores(), frameIndex);
    timeline.value = frameIndex;
    document.querySelector('#framelabel').textContent = 'frame ' + (frameIndex + 1) + '/' + frames.length;
    document.querySelector('#framestamp').textContent = 'replay';
    status.textContent = 'Replay';
  }

  function loadReplay(payload) {
    frames = payload.frames || [];
    if (!frames.length) { status.textContent = 'Replay has no frames'; return; }
    timeline.max = frames.length - 1;
    showReplayFrame(0);
    clearInterval(timer);
    timer = setInterval(() => {
      if (!playing || !frames.length) return;
      if (frameIndex >= frames.length - 1) {
        playing = false;
        playButton.textContent = 'Replay';
        return;
      }
      showReplayFrame(frameIndex + 1);
    }, 900);
  }

  let previousLiveFrame = null;
  function handleLive(payload) {
    const values = payload.team_feedback
      ? payload.team_feedback.map(f => f.target_score || 0)
      : payload.image_model_feedback ? [payload.image_model_feedback.target_score] : [];
    values.forEach((value, k) => {
      liveScores[k] = liveScores[k] || [];
      liveScores[k].push(value);
    });
    showFrame(payload, previousLiveFrame, liveScores);
    previousLiveFrame = payload;
    document.querySelector('#framestamp').textContent = payload.done ? 'episode complete' : 'live';
    status.textContent = payload.done ? 'Episode complete' : 'Live';
  }

  const params = new URLSearchParams(location.search);
  // Observatory static replay viewers receive the replay URL as ?replay=.
  const replayUri = params.get('replay') || params.get('replay_uri');
  const replayMode = location.pathname.endsWith('/replay');

  if (replayUri) {
    status.textContent = 'Fetching replay…';
    fetch(replayUri)
      .then(async response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (/\.(z|gz)$/.test(new URL(replayUri, location.href).pathname)) {
          const format = replayUri.endsWith('.gz') ? 'gzip' : 'deflate';
          const stream = response.body.pipeThrough(new DecompressionStream(format));
          return new Response(stream).json();
        }
        return response.json();
      })
      .then(loadReplay)
      .catch(error => { status.textContent = 'Failed to load replay: ' + error.message; });
  } else {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const suppliedAddress = params.get('address');
    const defaultAddress = protocol + '//' + location.host + '/' + (replayMode ? 'replay' : 'global');
    const socket = new WebSocket(suppliedAddress || defaultAddress);
    socket.onopen = () => { status.textContent = replayMode ? 'Loading replay…' : 'Live'; };
    socket.onerror = () => { status.textContent = 'Connection failed'; };
    socket.onmessage = event => {
      const payload = JSON.parse(event.data);
      if (payload.type === 'replay') loadReplay(payload);
      else if (payload.type === 'board_update') return;
      else handleLive(payload);
    };
  }

  timeline.addEventListener('input', () => { playing = false; playButton.textContent = 'Play'; showReplayFrame(timeline.value); });
  playButton.addEventListener('click', () => {
    if (!playing && frames.length && frameIndex >= frames.length - 1) showReplayFrame(0);
    playing = !playing;
    playButton.textContent = playing ? 'Pause' : 'Play';
  });
  window.addEventListener('resize', () => {
    if (frames.length) showReplayFrame(frameIndex);
    else if (previousLiveFrame) showFrame(previousLiveFrame, null, liveScores);
  });
  document.querySelector('#download').addEventListener('click', () => {
    const frame = frames.length ? frames[frameIndex] : previousLiveFrame;
    if (!frame) return;
    const cell = 24;
    const output = document.createElement('canvas');
    output.width = frame.width * cell; output.height = frame.height * cell;
    const ctx = output.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, output.width, output.height);
    frame.canvas.forEach((color, i) => {
      if (color === WHITE) return;
      ctx.fillStyle = color;
      ctx.fillRect((i % frame.width) * cell, Math.floor(i / frame.width) * cell, cell, cell);
    });
    const link = document.createElement('a');
    link.download = 'coplace-' + frame.target + '.png';
    link.href = output.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
