<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>co/place</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    /* The "paper arcade" match view (design canvas: Codrawing Arena Directions,
       P1 · Band). A light paper ground with a dot grid, pixel type for the
       scoreboard, the two team threads as white cards on either side of the
       board, and a score-by-turn chart under it. Deliberately single-theme:
       every colour is painted explicitly so the page holds on any host. */
    :root {
      --ink: #1F1B14;
      --paper: #FBF8F1;
      --rule: #D8D1C2;
      --muted: #8A7E6B;
      --amb: #E08A12;
      --teal: #1B7FAE;
      --red: #E11D48;
      --green: #2C9A55;
      --teamA: #F5A524;
      --teamB: #38BDF8;
      --board: #F7F4EC;
      --p8: 'Press Start 2P', ui-monospace, Menlo, monospace;
      --sf: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --rail: 322px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--ink); background: var(--paper);
      background-image: radial-gradient(#E6DFD0 1px, transparent 1px); background-size: 14px 14px;
      font-family: var(--sf); overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    main { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    a { color: var(--amb); }

    /* ---------- band ---------- */
    .band {
      padding: 18px 40px 16px; border-bottom: 2px solid var(--ink);
      display: flex; flex-direction: column; align-items: center; gap: 12px; flex: none;
    }
    .title { font-family: var(--p8); font-size: 15px; color: var(--amb); text-align: center; line-height: 1.6; }
    .bars { display: grid; grid-template-columns: 1fr 160px 1fr; gap: 28px; align-items: center; width: 100%; }
    .bars.solo { grid-template-columns: 1fr 160px; }
    .hp { min-width: 0; }
    .hp .line { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; }
    .hp.b .line { flex-direction: row-reverse; }
    .hp .lbl { font-family: var(--p8); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp.a .lbl { color: var(--amb); }
    .hp.b .lbl { color: var(--teal); }
    .hp .num { font-family: var(--p8); font-size: 14px; color: var(--ink); margin-left: auto; white-space: nowrap; }
    .hp.b .num { margin-left: 0; margin-right: auto; }
    .hp .meter {
      height: 22px; background: #FFFFFF; border: 3px solid var(--ink); padding: 3px;
      display: flex; flex-direction: row-reverse; position: relative;
    }
    .hp.b .meter { flex-direction: row; }
    .hp .ghost { position: absolute; top: 3px; bottom: 3px; right: 3px; background: #F3D3A6; }
    .hp.b .ghost { right: auto; left: 3px; }
    .hp .fill { position: relative; z-index: 1; transition: width .35s ease; }
    .hp.a .fill { background: linear-gradient(180deg, #FFC247, #E08A12); }
    .hp.b .fill { background: linear-gradient(180deg, #5CC8F0, #1B7FAE); }
    .hp .note { font-family: var(--p8); font-size: 7px; padding-top: 6px; color: var(--muted); white-space: nowrap; }
    .hp.b .note { text-align: right; }
    .note.down { color: var(--red); }
    .note.up { color: var(--green); }
    .round { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .round .n { font-family: var(--p8); font-size: 26px; color: var(--red); }
    .round .cap { font-family: var(--p8); font-size: 7px; color: var(--red); white-space: nowrap; }
    .round .status { font-family: var(--p8); font-size: 6px; color: var(--muted); padding-top: 2px; letter-spacing: .08em; }
    .round .status.live { color: var(--green); }

    /* ---------- arena ---------- */
    .arena {
      flex: 1; min-height: 0; display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail);
    }
    .arena.solo { grid-template-columns: var(--rail) minmax(0, 1fr); }
    .arena.solo .card.right { display: none; }

    /* group-chat cards */
    .card {
      display: flex; flex-direction: column; min-height: 0; background: #FFFFFF;
      border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--rule);
    }
    .card.left { margin: 22px 0 22px 22px; }
    .card.right { margin: 22px 22px 22px 0; }
    .card .head {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 14px 12px 10px; border-bottom: 2px solid var(--ink); background: #FFFFFF;
    }
    .card .faces { display: flex; }
    .face {
      width: 34px; height: 34px; border-radius: 4px; background: #FFFFFF; border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center; flex: none;
    }
    .faces .face { margin-left: -8px; }
    .faces .face:first-child { margin-left: 0; }
    .face svg { display: block; }
    .card .name { font-family: var(--p8); font-size: 9px; color: var(--ink); padding-top: 4px; text-align: center; line-height: 1.6; }
    .card .sub { font-family: var(--sf); font-size: 11px; color: var(--muted); }
    .thread { flex: 1; overflow-y: auto; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
    .divider { text-align: center; font-family: var(--p8); font-size: 7px; color: var(--muted); padding: 10px 0 4px; }
    .msg { display: flex; gap: 8px; align-items: flex-end; }
    .card.right .msg { flex-direction: row-reverse; }
    .msg .face { width: 30px; height: 30px; }
    .msg .body { max-width: 82%; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .card.right .msg .body { align-items: flex-end; }
    .msg .who { font-family: var(--sf); font-size: 10px; color: var(--muted); padding: 0 6px; display: flex; gap: 6px; align-items: center; }
    .msg .who b { font-weight: 600; }
    .tag { font-family: var(--p8); font-size: 6px; color: var(--paper); padding: 2px 5px; }
    .tag.raid { background: var(--red); }
    .tag.repair { background: var(--green); }
    .tag.paint { background: var(--teal); }
    .tag.plan { background: var(--muted); }
    .tag.collided { background: var(--ink); }
    .msg .bubble {
      font-family: var(--sf); font-size: 12.5px; line-height: 1.35; color: var(--ink);
      background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 3px 3px 0 var(--rule);
      padding: 7px 11px; white-space: pre-line; text-wrap: pretty; overflow-wrap: anywhere;
    }
    .sys { text-align: center; font-family: var(--p8); font-size: 6px; line-height: 1.9; color: var(--muted); padding: 2px 8px; }
    .sys.raid { color: var(--red); }
    .sys.collide { color: var(--ink); }
    .card .foot { padding: 8px 12px 12px; border-top: 2px solid var(--ink); }
    .card .foot div {
      height: 32px; border: 2px solid var(--rule); border-radius: 4px; font-family: var(--sf); font-size: 12px;
      color: var(--muted); display: flex; align-items: center; padding: 0 12px;
    }

    /* centre column */
    .centre { display: flex; flex-direction: column; min-height: 0; position: relative; overflow: hidden; }
    .quote { padding: 22px 26px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
    .quote .q { font-family: var(--p8); font-size: 9px; line-height: 2.1; color: var(--ink); text-align: center; max-width: 900px; }
    .quote .src { display: flex; align-items: center; gap: 14px; font-family: var(--p8); font-size: 7px; color: var(--muted); letter-spacing: .1em; }
    .quote .src i { width: 40px; height: 2px; background: var(--rule); display: block; }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 26px 0; min-height: 0; }
    .frame { position: relative; }
    .plate { position: relative; border: 5px solid var(--ink); padding: 10px; background: #FFFFFF; box-shadow: 0 18px 50px rgba(31,27,20,.18); }
    #board { display: block; image-rendering: pixelated; }
    #fx { position: absolute; left: 10px; top: 10px; pointer-events: none; }

    /* ---------- motion ---------- */
    @keyframes slam { 0% { transform: rotate(-6deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-6deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }
    @keyframes slamwin { 0% { transform: translateX(-50%) scale(2.4); opacity: 0; } 60% { transform: translateX(-50%) scale(.94); opacity: 1; } 100% { transform: translateX(-50%) scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    @keyframes pop { 0% { transform: translateY(10px) scale(.96); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes flashred { 0% { background: #FBE3E8; } 100% { background: #FFFFFF; } }
    .stamp.raid.slam { animation: slam .45s cubic-bezier(.2,.9,.3,1.3) both; }
    .stamp.win.slam { animation: slamwin .6s cubic-bezier(.2,.9,.3,1.3) both; }
    .hp .num.chip { display: inline-block; animation: shake .4s ease both; color: var(--red); }
    .hp .meter.chip { animation: flashred .6s ease both; }
    .msg.fresh, .sys.fresh { animation: pop .35s ease both; }
    .msg.fresh:nth-child(2) { animation-delay: .08s; } .msg.fresh:nth-child(3) { animation-delay: .16s; } .msg.fresh:nth-child(4) { animation-delay: .24s; }
    @media (prefers-reduced-motion: reduce) { .stamp, .hp .num, .hp .meter, .msg, .sys { animation: none !important; } }
    .stamp {
      position: absolute; font-family: var(--p8); font-size: 18px; text-shadow: 2px 2px 0 var(--paper);
      white-space: nowrap; pointer-events: none;
    }
    .stamp.raid { left: 28px; top: 20px; color: var(--red); transform: rotate(-6deg); }
    .stamp.win { left: 50%; bottom: -34px; transform: translateX(-50%); font-size: 18px; }
    .stamp.coord { right: 16px; bottom: 16px; font-size: 7px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 6px; text-shadow: none; }
    .bottom { padding: 22px 26px 16px; display: flex; flex-direction: column; gap: 10px; flex: none; }
    .chartbox { border: 3px solid var(--rule); background: #FFFFFF; padding: 10px 14px 8px; }
    .chartbox .hd, .chartbox .ft { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--p8); font-size: 7px; color: var(--muted); }
    .chartbox .hd { padding-bottom: 6px; }
    .chartbox .ft { padding-top: 6px; }
    .chartbox .hd .a { color: var(--amb); }
    .chartbox .hd .b { color: var(--teal); }
    .chartbox .ft .mark { color: var(--red); }
    #spark { display: block; width: 100%; height: 96px; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .controls button {
      font-family: var(--p8); font-size: 8px; color: var(--paper); background: var(--ink); border: 0;
      padding: 7px 10px; cursor: pointer; white-space: nowrap;
    }
    .controls button:hover { background: #3A3328; }
    .controls button#download { background: transparent; color: var(--muted); border: 2px solid var(--rule); padding: 5px 8px; }
    .controls input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; background: var(--rule); outline: none; margin: 0; }
    .controls input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 18px; background: var(--ink); cursor: pointer; }
    .controls input[type=range]::-moz-range-thumb { width: 6px; height: 18px; background: var(--ink); border: 0; border-radius: 0; cursor: pointer; }
    .framelabel { font-family: var(--p8); font-size: 8px; color: var(--muted); white-space: nowrap; }

    @media (max-width: 1400px) { :root { --rail: 270px; } .msg .bubble { font-size: 11.5px; } .quote { display: none; } }
    @media (max-width: 1100px) { .arena { grid-template-columns: minmax(0, 1fr); } .card { display: none; } .bars { grid-template-columns: 1fr 120px 1fr; gap: 14px; } }
  </style>
</head>
<body>
<main>
  <header class="band">
    <div class="title" id="title">&nbsp;</div>
    <div class="bars" id="bars">
      <div class="hp a" id="hp-a">
        <div class="line"><span class="lbl" id="lbl-a">1P</span><span class="num" id="num-a">&mdash;</span></div>
        <div class="meter"><div class="ghost" id="ghost-a" style="width:0"></div><div class="fill" id="fill-a" style="width:0"></div></div>
        <div class="note" id="note-a">&nbsp;</div>
      </div>
      <div class="round">
        <div class="n" id="turn">0</div>
        <div class="cap" id="round-cap">ROUND 0 / 0</div>
        <div class="status" id="status">CONNECTING</div>
      </div>
      <div class="hp b" id="hp-b">
        <div class="line"><span class="lbl" id="lbl-b">2P</span><span class="num" id="num-b">&mdash;</span></div>
        <div class="meter"><div class="ghost" id="ghost-b" style="width:0"></div><div class="fill" id="fill-b" style="width:0"></div></div>
        <div class="note" id="note-b">&nbsp;</div>
      </div>
    </div>
  </header>

  <div class="arena" id="arena">
    <aside class="card left" id="rail-left">
      <div class="head"><div class="faces" id="faces-left"></div><div class="name" id="name-left">&nbsp;</div><div class="sub" id="sub-left">&nbsp;</div></div>
      <div class="thread" id="thread-left"></div>
      <div class="foot"><div>Agents only &middot; spectating</div></div>
    </aside>

    <section class="centre">
      <div class="quote">
        <div class="q">There is an empty canvas.<br>You may place a pixel upon it, but you must wait to place another.<br>Individually you can create something. Together you can create something more.</div>
        <div class="src"><i></i><span>R/PLACE &middot; 2017</span><i></i></div>
      </div>
      <div class="stage" id="stage">
        <div class="frame">
          <div class="plate"><canvas id="board"></canvas><canvas id="fx"></canvas></div>
          <div class="stamp raid" id="stamp-raid" hidden></div>
          <div class="stamp win" id="stamp-win" hidden></div>
          <div class="stamp coord" id="stamp-coord" hidden></div>
        </div>
      </div>
      <div class="bottom">
        <div class="chartbox">
          <div class="hd"><span>SCORE BY TURN</span><span id="charthint"></span></div>
          <canvas id="spark"></canvas>
          <div class="ft"><span>T1</span><span class="mark" id="chartmark"></span><span id="chartend"></span></div>
        </div>
        <div class="controls">
          <button id="play">&#9646;&#9646; PAUSE</button>
          <input type="range" id="timeline" min="0" max="0" value="0">
          <span class="framelabel" id="framelabel"></span>
          <button id="download">PNG</button>
        </div>
      </div>
    </section>

    <aside class="card right" id="rail-right">
      <div class="head"><div class="faces" id="faces-right"></div><div class="name" id="name-right">&nbsp;</div><div class="sub" id="sub-right">&nbsp;</div></div>
      <div class="thread" id="thread-right"></div>
      <div class="foot"><div>Agents only &middot; spectating</div></div>
    </aside>
  </div>
</main>
<script>
  const SEAT_COLORS = ['#FB7185', '#60A5FA', '#4ADE80', '#FBBF24', '#C084FC',
                       '#F472B6', '#2DD4BF', '#A3E635', '#818CF8', '#FB923C'];
  const TEAM_COLORS = ['#F5A524', '#38BDF8'];
  const WHITE = '#FFFFFF';

  // half), REPAIR (re-took a square the enemy had hit), PAINT, COLLIDED, PLAN.
  function seatTags(frame, previous) {
    const tags = {};
    for (const i of writesOf(frame, previous)) {
      const owner = frame.owners ? frame.owners[i] : -1;
      if (owner < 0) continue;
      let tag = 'paint';
      if (isAttack(frame, owner, i)) tag = 'raid';
      else if (previous && previous.owners && previous.owners[i] >= 0 && teamOfSlot(frame, previous.owners[i]) !== teamOfSlot(frame, owner)) tag = 'repair';
      else if (previous && previous.canvas[i] === WHITE && previous.owners && previous.owners[i] >= 0) tag = 'repair';
      if (tag === 'raid' || !tags[owner]) tags[owner] = tag;
    }
    for (const slot of frame.collision_slots || []) if (!tags[slot]) tags[slot] = 'collided';
    return tags;
  }

  /* ---------- seats and threads ---------- */
  function layoutSeats(frame) {
    const teams = frame.teams || [];

    const next = teams.length === 2
      ? { versus: true, left: teams[0].slots.slice(), right: teams[1].slots.slice() }
      : { versus: false, left: Array.from({ length: count }, (_, i) => i), right: [] };
    const same = seatLayout && seatLayout.versus === next.versus &&
      String(seatLayout.left) === String(next.left) && String(seatLayout.right) === String(next.right);
    if (same) return;
    seatLayout = next;
    document.querySelector('#arena').classList.toggle('solo', !next.versus);
    document.querySelector('#bars').classList.toggle('solo', !next.versus);
    document.querySelector('#hp-b').hidden = !next.versus;
    [['left', next.left], ['right', next.right]].forEach(([side, slots]) => {
      document.querySelector('#faces-' + side).innerHTML =
        slots.map(s => '<div class="face">' + sprite(s, 24) + '</div>').join('');
      document.querySelector('#sub-' + side).textContent = slots.length + ' agent' + (slots.length === 1 ? '' : 's') + ' · group thread';
    });
    if (next.versus) {
      teams.forEach((team, k) => {
        document.querySelector('#name-' + (k ? 'right' : 'left')).textContent = team.name + ' · ' + team.target;
      });
    } else {
      document.querySelector('#name-left').textContent = 'Agents · ' + frame.target;
    }
  }

  const liveThreads = { left: [], right: [] };
  function threadHtml(frame, previous, slots, fresh) {
    const tags = seatTags(frame, previous);
    const teams = frame.teams || [];
    const mine = new Set(slots);
    const parts = [];
    const messages = (frame.messages || []).filter(m => mine.has(m.slot));
    // System lines first: what the board did to this team this turn.
    const events = [];
    for (const i of writesOf(frame, previous)) {
      const owner = frame.owners ? frame.owners[i] : -1;
      if (owner < 0 || !isAttack(frame, owner, i)) continue;
      const region = regionAt(frame, i % frame.width);
      if (!slots.length || !teams[region] || !teams[region].slots.some(s => mine.has(s))) continue;
      const at = '(' + (i % frame.width) + ', ' + Math.floor(i / frame.width) + ')';
      events.push('<div class="sys raid' + (fresh ? ' fresh' : '') + '">RAID · AGENT ' + owner + ' ' + (frame.canvas[i] === WHITE ? 'ERASED' : 'PAINTED OVER') + ' ' + at + '</div>');
    }
    const collided = (frame.collision_slots || []).filter(s => mine.has(s));
    if (collided.length) events.push('<div class="sys collide' + (fresh ? ' fresh' : '') + '">COLLISION · AGENT ' + collided.join(' + AGENT ') + ' · WRITE DROPPED</div>');
    if (!messages.length && !events.length) return '';
    parts.push('<div class="divider">TURN ' + frame.turn + (frame.turn === frame.max_turns ? ' · FINAL' : '') + '</div>');
    for (const m of messages) {
      const tag = tags[m.slot] || 'plan';
      parts.push(
        '<div class="msg' + (fresh ? ' fresh' : '') + '">' +
        '<div class="face">' + sprite(m.slot, 22) + '</div>' +
        '<div class="body"><div class="who"><b style="color:' + SEAT_COLORS[m.slot % SEAT_COLORS.length] + '">Agent ' + m.slot + '</b>' +
        '<span class="tag ' + tag + '">' + tag.toUpperCase() + '</span></div>' +
        '<div class="bubble">' + esc(m.text) + '</div></div></div>');

  }
  function renderThreads(frame, index, animate) {
    [['left', seatLayout.left], ['right', seatLayout.right]].forEach(([side, slots]) => {
      const el = document.querySelector('#thread-' + side);
      if (!el || !slots.length) return;
      let html;
      if (frames.length) {
        const upto = index === undefined ? frames.length - 1 : index;
        const chunks = [];
        for (let f = 0; f <= upto && f < frames.length; f++) chunks.push(threadHtml(frames[f], f > 0 ? frames[f - 1] : null, slots, animate && f === upto));
        html = chunks.join('');
      } else {
        html = liveThreads[side].join('');

      const stuck = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.innerHTML = html;
      if (stuck || frames.length) el.scrollTop = el.scrollHeight;
    });
  }

  /* ---------- band ---------- */
  function renderBand(frame, previous, animate) {
    const teams = frame.teams || [];
    document.querySelector('#turn').textContent = frame.turn;
    const last = frame.turn >= frame.max_turns;
    document.querySelector('#round-cap').textContent = last ? 'FINAL ROUND' : 'ROUND ' + frame.turn + ' / ' + frame.max_turns;
    const title = document.querySelector('#title');
    if (!teams.length) {
      const fb = frame.image_model_feedback || {};
      const prev = previous && previous.image_model_feedback ? previous.image_model_feedback.target_score : null;
      title.textContent = 'CAN THEY DRAW A ' + String(frame.target || '').toUpperCase() + '?';
      setBar('a', 'AGENTS · ' + String(frame.target || '').toUpperCase(), fb.target_score || 0, prev, fb.score_delta || 0, fb.pass_threshold, animate);
      return;
    }
    const sameTarget = teams[0].target === teams[1].target;
    title.textContent = sameTarget
      ? 'WHO CAN DRAW THE BEST ' + teams[0].target.toUpperCase() + '?'
      : teams[0].target.toUpperCase() + ' VS ' + teams[1].target.toUpperCase();
    const feedback = frame.team_feedback || [];
    const prevFeedback = previous ? (previous.team_feedback || []) : [];
    teams.forEach((team, k) => {
      const f = feedback[k] || {};
      const p = prevFeedback[k];
      const side = k ? 'b' : 'a';
      const label = k ? team.name.toUpperCase() + ' · 2P' : '1P · ' + team.name.toUpperCase();
      setBar(side, label, f.target_score || 0, p ? p.target_score : null, f.score_delta || 0, null, animate);
    });
  }
  function setBar(side, label, score, previousScore, delta, threshold, animate) {
    document.querySelector('#lbl-' + side).textContent = label;
    const num = document.querySelector('#num-' + side);
    num.textContent = pct(score) + '%';
    num.classList.remove('chip');
    const meter = num.parentElement.nextElementSibling;
    meter.classList.remove('chip');
    if (animate && delta < -0.0005) { retrigger(num, 'chip'); retrigger(meter, 'chip'); }
    document.querySelector('#fill-' + side).style.width = Math.max(0, Math.min(100, 100 * score)) + '%';
    const ghost = document.querySelector('#ghost-' + side);
    ghost.style.width = (previousScore !== null && previousScore > score) ? Math.min(100, 100 * previousScore) + '%' : '0';
    const note = document.querySelector('#note-' + side);
    const d = 100 * delta;
    if (Math.abs(d) < 0.05) {
      note.className = 'note';
      note.textContent = threshold ? 'NEED ' + pct(threshold, 0) + '% TO PASS' : 'NO CHANGE THIS TURN';
    } else if (d < 0) {
      note.className = 'note down'; note.textContent = 'CHIP −' + Math.abs(d).toFixed(1) + ' THIS TURN';
    } else {
      note.className = 'note up'; note.textContent = '+' + d.toFixed(1) + ' THIS TURN';
    }
  }

  /* ---------- effects: a smoke bomb for an erased square, sparks for a
     square painted over, a seat-coloured ring for fresh paint ---------- */
  let particles = [];
  let fxCell = 10, fxSize = { w: 1, h: 1 };
  let fxRaf = 0;
  function rand(a, b) { return a + Math.random() * (b - a); }
  // Positions are in board units so a resize mid-puff keeps everything in place.
  function puff(x, y, opts) {
    const now = performance.now();
    for (let n = 0; n < opts.count; n++) {
      particles.push({
        kind: 'square', born: now + rand(0, opts.stagger || 0), life: rand(opts.life[0], opts.life[1]),
        x: x + 0.5 + rand(-0.25, 0.25), y: y + 0.5 + rand(-0.25, 0.25),
        vx: rand(-opts.drift, opts.drift), vy: rand(opts.rise[0], opts.rise[1]),
        s0: rand(opts.size[0], opts.size[1]), grow: opts.grow || 0,
        color: opts.colors[Math.floor(Math.random() * opts.colors.length)], alpha: opts.alpha || 0.9,
      });
    }
  }
  function smokeBomb(x, y) {
    const now = performance.now();
    // the bang: one dark square that snaps out
    particles.push({ kind: 'square', born: now, life: 180, x: x + 0.5, y: y + 0.5, vx: 0, vy: 0, s0: 1.8, grow: 1.6, color: '#1F1B14', alpha: 0.6 });
    particles.push({ kind: 'square', born: now + 40, life: 220, x: x + 0.5, y: y + 0.5, vx: 0, vy: 0, s0: 1.2, grow: 2.2, color: '#FFFFFF', alpha: 0.9 });
    particles.push({ kind: 'ring', born: now, life: 380, x: x + 0.5, y: y + 0.5, s0: 1, grow: 2.6, color: '#E11D48', alpha: 0.9, width: 0.16 });
    // the smoke: grey squares that billow up, grow, and thin out
    puff(x, y, { count: 22, stagger: 160, life: [750, 1300], drift: 1.1, rise: [-3.2, -1.0], size: [0.55, 1.15], grow: 1.3,

    puff(x, y, { count: 6, life: [300, 520], drift: 2.2, rise: [-1.6, 0.4], size: [0.18, 0.3], grow: -0.2,

  }
  function sparks(x, y, color) {
    const now = performance.now();
    particles.push({ kind: 'ring', born: now, life: 320, x: x + 0.5, y: y + 0.5, s0: 1, grow: 1.8, color: color, alpha: 0.9, width: 0.16 });

  }
  function ring(x, y, color) {

  }
  function spawnEffects(frame, previous, changed) {
    if (!MOTION || !previous) return;
    for (const i of changed) {
      const x = i % frame.width, y = Math.floor(i / frame.width);
      const owner = frame.owners ? frame.owners[i] : -1;
      const seat = owner >= 0 ? SEAT_COLORS[owner % SEAT_COLORS.length] : '#1F1B14';
      const raid = isAttack(frame, owner, i);
      if (frame.canvas[i] === WHITE) smokeBomb(x, y);
      else if (raid) sparks(x, y, '#E11D48');

  function fxTick(now) {

    fxCtx.clearRect(0, 0, fxSize.w, fxSize.h);
    const cell = fxCell;
    const keep = [];
    for (const p of particles) {
      const age = now - p.born;
      if (age < 0) { keep.push(p); continue; }
      const t = age / p.life;
      if (t >= 1) continue;
      keep.push(p);
      const ease = 1 - (1 - t) * (1 - t);
      const px = (p.x + (p.vx || 0) * ease * p.life / 1000) * cell;
      const py = (p.y + (p.vy || 0) * ease * p.life / 1000) * cell;
      const size = Math.max(1, (p.s0 + p.grow * ease) * cell);
      fxCtx.globalAlpha = Math.max(0, p.alpha * (1 - t));

        fxCtx.strokeRect(Math.round(px - size / 2) + 0.5, Math.round(py - size / 2) + 0.5, Math.round(size), Math.round(size));
      } else {
        fxCtx.fillStyle = p.color;

  /* ---------- board ---------- */
  function drawBoard(frame, previous) {
    const stage = document.querySelector('#stage');
    const avail = { w: stage.clientWidth - 52 - 30, h: stage.clientHeight - 18 - 30 };
    const cell = Math.max(4, Math.floor(Math.min(avail.w / frame.width, avail.h / frame.height)));
    const size = { w: frame.width * cell + 1, h: frame.height * cell + 1 };
    const scale = window.devicePixelRatio || 1;
    board.width = size.w * scale; board.height = size.h * scale;
    board.style.width = size.w + 'px'; board.style.height = size.h + 'px';
    fx.width = size.w * scale; fx.height = size.h * scale;
    fx.style.width = size.w + 'px'; fx.style.height = size.h + 'px';
    fxCell = cell; fxSize = size;
    if (particles.length && !fxRaf) fxRaf = requestAnimationFrame(fxTick);
    boardCtx.setTransform(scale, 0, 0, scale, 0, 0);
    boardCtx.fillStyle = '#F7F4EC';
    boardCtx.fillRect(0, 0, size.w, size.h);
    const teams = frame.teams || [];
    if (teams.length === 2) {
      teams.forEach((team, k) => {
        boardCtx.fillStyle = TEAM_COLORS[k];
        boardCtx.globalAlpha = 0.07;
        boardCtx.fillRect(team.region.x * cell, team.region.y * cell, team.region.width * cell, team.region.height * cell);
        boardCtx.globalAlpha = 1;

    }

    boardCtx.lineWidth = 1;
    for (let x = 0; x <= frame.width; x++) {
      boardCtx.beginPath(); boardCtx.moveTo(x * cell + 0.5, 0); boardCtx.lineTo(x * cell + 0.5, size.h); boardCtx.stroke();
    }

    }

    for (let i = 0; i < frame.canvas.length; i++) {
      const color = frame.canvas[i];
      if (color === WHITE) continue;
      const x = i % frame.width, y = Math.floor(i / frame.width);
      boardCtx.fillStyle = color;
      boardCtx.fillRect(x * cell + gap, y * cell + gap, cell - 2 * gap + 1, cell - 2 * gap + 1);

        boardCtx.fillStyle = 0.299 * r + 0.587 * g + 0.114 * b > 140 ? 'rgba(31,27,20,.55)' : 'rgba(255,255,255,.7)';
        boardCtx.font = '700 ' + Math.max(7, Math.floor(cell * 0.4)) + 'px ui-monospace, Menlo, monospace';
        boardCtx.textAlign = 'center'; boardCtx.textBaseline = 'middle';

      }
    }
    if (teams.length === 2) {
      const seam = teams[1].region.x * cell + 0.5;
      boardCtx.strokeStyle = 'rgba(11,15,20,0.55)';
      boardCtx.lineWidth = 2;
      boardCtx.setLineDash([7, 5]);
      boardCtx.beginPath(); boardCtx.moveTo(seam, 0); boardCtx.lineTo(seam, size.h); boardCtx.stroke();
      boardCtx.setLineDash([]);

    (frame.owners || []).forEach((owner, i) => {
      if (!isAttack(frame, owner, i)) return;
      const x = (i % frame.width) * cell, y = Math.floor(i / frame.width) * cell;
      boardCtx.strokeStyle = '#E11D48';
      boardCtx.lineWidth = Math.max(1, cell * 0.14);
      boardCtx.strokeRect(x + gap + 0.5, y + gap + 0.5, cell - 2 * gap, cell - 2 * gap);
      if (frame.canvas[i] === WHITE) {
        const p = Math.max(2, cell * 0.3);

    const changed = writesOf(frame, previous);
    if (previous) {

      for (const i of changed) {
        const owner = frame.owners ? frame.owners[i] : -1;
        const x = i % frame.width, y = Math.floor(i / frame.width);
        boardCtx.strokeStyle = owner >= 0 ? SEAT_COLORS[owner % SEAT_COLORS.length] : '#1F1B14';

      }
    }
    return changed;
  }

  let winShown = false;
  function renderStamps(frame, changed, animate) {
    const raids = changed.filter(i => isAttack(frame, frame.owners ? frame.owners[i] : -1, i)).length;
    const raid = document.querySelector('#stamp-raid');
    raid.hidden = !raids;
    raid.textContent = 'RAID ×' + raids;
    if (raids && animate) retrigger(raid, 'slam');
    const teams = frame.teams || [];
    const win = document.querySelector('#stamp-win');
    const feedback = frame.team_feedback || [];
    if (frame.done && teams.length === 2 && feedback.length === 2) {
      const a = feedback[0].target_score || 0, b = feedback[1].target_score || 0;
      const winner = a === b ? null : (a > b ? 0 : 1);
      win.hidden = false;
      win.style.color = winner === null ? 'var(--muted)' : (winner ? 'var(--teal)' : 'var(--amb)');
      win.textContent = winner === null ? 'DRAW · ' + pct(a) + ' TO ' + pct(b)
        : (winner ? '2P' : '1P') + ' WINS · ' + pct(winner ? b : a) + ' TO ' + pct(winner ? a : b);
    } else if (frame.done && !teams.length && frame.image_model_feedback) {
      const fb = frame.image_model_feedback;
      win.hidden = false;
      win.style.color = fb.passing ? 'var(--green)' : 'var(--red)';
      win.textContent = (fb.passing ? 'PASSED · ' : 'NOT PASSING · ') + pct(fb.target_score) + '%';
    } else {
      win.hidden = true;
    }
    if (!win.hidden && !winShown && animate) retrigger(win, 'slam');
    winShown = !win.hidden;
    const coord = document.querySelector('#stamp-coord');
    if (changed.length && changed.length < 12) {
      coord.hidden = false;
      coord.textContent = changed.map(i => '(' + (i % frame.width) + ', ' + Math.floor(i / frame.width) + ')').join('  ');
    } else {
      coord.hidden = true;
    }
  }

  /* ---------- score chart ---------- */
  function raidTurns(list) {
    const out = [];
    for (let f = 1; f < list.length; f++) {
      const cur = list[f], prev = list[f - 1];
      let hit = false;
      for (let i = 0; i < cur.canvas.length && !hit; i++) {
        if (prev.canvas[i] !== cur.canvas[i] && isAttack(cur, cur.owners ? cur.owners[i] : -1, i)) hit = true;
      }
      if (hit) out.push(f);
    }
    return out;
  }
  function drawSpark(series, currentIndex, colors, raids, total) {
    const scale = window.devicePixelRatio || 1;
    const w = spark.clientWidth || 400, h = Math.max(40, spark.clientHeight || 96);
    spark.width = w * scale; spark.height = h * scale;
    const ctx = spark.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pad = { l: 2, r: 2, t: 4, b: 4 };
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const length = Math.max(total || 0, ...series.map(s => s.length), 2);
    const max = Math.max(0.05, ...series.flat());
    const x = i => pad.l + (i / (length - 1)) * plotW;
    const y = v => pad.t + plotH - (v / max) * plotH;
    // Turns in which someone wrote in the other half, washed red.
    ctx.fillStyle = 'rgba(225,29,72,0.12)';
    (raids || []).forEach(f => ctx.fillRect(x(f - 1), pad.t, Math.max(1, x(f) - x(f - 1)), plotH));
    ctx.strokeStyle = '#D8D1C2'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t + 1); ctx.lineTo(w - pad.r, pad.t + 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t + plotH - 1); ctx.lineTo(w - pad.r, pad.t + plotH - 1); ctx.stroke();
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(pad.l, y(max / 2)); ctx.lineTo(w - pad.r, y(max / 2)); ctx.stroke();
    ctx.setLineDash([]);
    series.forEach((scores, k) => {
      if (!scores.length) return;
      const color = (colors && colors[k]) || '#E08A12';
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath();
      scores.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
      ctx.stroke();
    });
    const upto = currentIndex === undefined ? Math.max(...series.map(s => s.length)) - 1 : currentIndex;
    ctx.strokeStyle = '#1F1B14'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x(upto), pad.t - 3); ctx.lineTo(x(upto), pad.t + plotH + 3); ctx.stroke();
    series.forEach((scores, k) => {
      if (!scores.length) return;
      const i = Math.min(upto, scores.length - 1);
      ctx.fillStyle = (colors && colors[k]) || '#E08A12';
      ctx.beginPath(); ctx.arc(x(i), y(scores[i]), 4, 0, 2 * Math.PI); ctx.fill();
    });
  }

  /* ---------- frame ---------- */
  function showFrame(frame, previous, series, scoreIndex, list, animate) {
    layoutSeats(frame);
    renderBand(frame, previous, animate);
    const changed = drawBoard(frame, previous);
    if (animate) spawnEffects(frame, previous, changed);
    renderStamps(frame, changed, animate);
    renderThreads(frame, scoreIndex, animate);
    const teams = frame.teams || [];
    const raids = raidTurns(list || []);
    drawSpark(series, scoreIndex, teams.length ? ['#E08A12', '#1B7FAE'] : null, raids, frame.max_turns);
    document.querySelector('#charthint').innerHTML = teams.length
      ? '<span class="a">1P</span> vs <span class="b">2P</span> · red = a raid turn'
      : esc(frame.target || '');
    const firstRaid = raids.length ? list[raids[0]].turn : null;
    document.querySelector('#chartmark').textContent = firstRaid ? 'T' + firstRaid + ' · FIRST RAID' : '';
    document.querySelector('#chartend').textContent = 'T' + frame.max_turns;
  }

  function replayScores() {
    const teams = (frames[0] && frames[0].teams) || [];
    if (teams.length) {
      return teams.map((_, k) => frames.map(f => ((f.team_feedback || [])[k] || {}).target_score || 0));
    }
    return [frames.map(f => (f.image_model_feedback ? f.image_model_feedback.target_score : 0))];
  }

  let lastAnimated = -1;
  function showReplayFrame(index) {
    frameIndex = Math.max(0, Math.min(frames.length - 1, Number(index)));
    const frame = frames[frameIndex];
    const animate = frameIndex !== lastAnimated;
    lastAnimated = frameIndex;
    showFrame(frame, frameIndex > 0 ? frames[frameIndex - 1] : null, replayScores(), frameIndex, frames, animate);
    timeline.value = frameIndex;
    document.querySelector('#framelabel').textContent = (frameIndex + 1) + ' / ' + frames.length;
    status.textContent = frame.done && frameIndex === frames.length - 1 ? 'REPLAY · COMPLETE' : 'REPLAY';
    status.classList.remove('live');
  }

  function loadReplay(payload) {
    frames = payload.frames || [];
    if (!frames.length) { status.textContent = 'NO FRAMES'; return; }
    timeline.max = frames.length - 1;
    showReplayFrame(0);
    clearInterval(timer);
    timer = setInterval(() => {
      if (!playing || !frames.length) return;
      if (frameIndex >= frames.length - 1) {
        playing = false; playButton.innerHTML = '&#9654; REPLAY';
        return;
      }
      showReplayFrame(frameIndex + 1);
    }, 800);
  }

  let previousLiveFrame = null;
  function handleLive(payload) {
    const values = payload.team_feedback
      ? payload.team_feedback.map(f => f.target_score || 0)
      : payload.image_model_feedback ? [payload.image_model_feedback.target_score] : [];
    values.forEach((value, k) => {
      liveScores[k] = liveScores[k] || [];
      liveScores[k].push(value);
    });
    liveFrames.push(payload);
    layoutSeats(payload);
    [['left', seatLayout.left], ['right', seatLayout.right]].forEach(([side, slots]) => {
      if (!slots.length) return;
      // older turns lose their entrance animation so only the new one pops in
      liveThreads[side] = liveThreads[side].map(h => h.split(' fresh"').join('"'));
      liveThreads[side].push(threadHtml(payload, previousLiveFrame, slots, true));
    });
    showFrame(payload, previousLiveFrame, liveScores, undefined, liveFrames, true);
    previousLiveFrame = payload;
    status.textContent = payload.done ? 'COMPLETE' : 'LIVE';
    status.classList.toggle('live', !payload.done);
    document.querySelector('#framelabel').textContent = payload.turn + ' / ' + payload.max_turns;
  }

  const params = new URLSearchParams(location.search);
  const replayUri = params.get('replay') || params.get('replay_uri');
  const replayMode = location.pathname.endsWith('/replay');
  // A standalone page carries its episode inline: no server, no network.
  const embedded = document.getElementById('replay-data');

  if (embedded) {
    loadReplay(JSON.parse(embedded.textContent));
  } else if (replayUri) {
    status.textContent = 'LOADING';
    fetch(replayUri)
      .then(async response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (/\.(z|gz)$/.test(new URL(replayUri, location.href).pathname)) {
          const format = replayUri.endsWith('.gz') ? 'gzip' : 'deflate';
          return new Response(response.body.pipeThrough(new DecompressionStream(format))).json();
        }
        return response.json();
      })
      .then(loadReplay)
      .catch(error => { status.textContent = 'FAILED: ' + error.message; });
  } else {
    document.querySelector('.controls').style.visibility = 'hidden';
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const suppliedAddress = params.get('address');
    const defaultAddress = protocol + '//' + location.host + '/' + (replayMode ? 'replay' : 'global');
    const socket = new WebSocket(suppliedAddress || defaultAddress);
    socket.onopen = () => { status.textContent = replayMode ? 'LOADING' : 'LIVE · WAITING'; };
    socket.onerror = () => { status.textContent = 'NO CONNECTION'; };
    socket.onmessage = event => {
      const payload = JSON.parse(event.data);
      if (payload.type === 'replay') { document.querySelector('.controls').style.visibility = ''; loadReplay(payload); }
      else if (payload.type === 'board_update') return;
      else handleLive(payload);
    };
  }

  timeline.addEventListener('input', () => {
    playing = false; playButton.innerHTML = '&#9654; PLAY'; showReplayFrame(timeline.value);
  });
  playButton.addEventListener('click', () => {
    if (!playing && frames.length && frameIndex >= frames.length - 1) showReplayFrame(0);
    playing = !playing;
    playButton.innerHTML = playing ? '&#9646;&#9646; PAUSE' : '&#9654; PLAY';
  });
  window.addEventListener('resize', () => {
    if (frames.length) showReplayFrame(frameIndex);
    else if (previousLiveFrame) showFrame(previousLiveFrame, null, liveScores, undefined, liveFrames);
  });
  // The standalone build drops this button: a sandboxed page cannot hand the
  // viewer a file, so the control would be dead.
  const downloadButton = document.querySelector('#download');
  if (downloadButton) downloadButton.addEventListener('click', () => {
    const frame = frames.length ? frames[frameIndex] : previousLiveFrame;
    if (!frame) return;
    const cell = 24;
    const output = document.createElement('canvas');
    output.width = frame.width * cell; output.height = frame.height * cell;
    const ctx = output.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, output.width, output.height);
    frame.canvas.forEach((color, i) => {
      if (color === WHITE) return;
      ctx.fillStyle = color;
      ctx.fillRect((i % frame.width) * cell, Math.floor(i / frame.width) * cell, cell, cell);
    });
    const link = document.createElement('a');
    link.download = 'coplace-' + frame.target.replace(/\s+/g, '-') + '.png';
    link.href = output.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
